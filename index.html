<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figma Baby Crib Interactive Prototype</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef0f6;
      color: #1b1523;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
    }

    .stage {
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .phone {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      overflow: hidden;
      background: #fff;
      box-shadow: 0 24px 80px rgba(31, 28, 46, 0.18);
      transition: width 320ms cubic-bezier(0.22, 1, 0.36, 1), height 320ms cubic-bezier(0.22, 1, 0.36, 1);
      contain: layout paint;
    }

    .screen-stack,
    .screen-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .screen-layer {
      z-index: 1;
      transform: translate3d(0, 0, 0);
      opacity: 1;
      filter: none;
      will-change: transform, opacity, filter;
      transition:
        transform var(--motion-duration, 360ms) cubic-bezier(0.22, 1, 0.36, 1),
        opacity var(--motion-duration, 360ms) ease,
        filter var(--motion-duration, 360ms) ease;
    }

    .screen-layer.no-motion {
      transition: none;
    }

    .screen-layer.from-right {
      transform: translate3d(100%, 0, 0);
      opacity: 0.98;
    }

    .screen-layer.from-left {
      transform: translate3d(-32%, 0, 0);
      opacity: 0.72;
      filter: brightness(0.96);
    }

    .screen-layer.from-right-soft {
      transform: translate3d(42%, 0, 0);
      opacity: 0.84;
    }

    .screen-layer.from-left-soft {
      transform: translate3d(-42%, 0, 0);
      opacity: 0.84;
    }

    .screen-layer.from-bottom {
      transform: translate3d(0, 100%, 0);
      opacity: 0.98;
      filter: drop-shadow(0 -18px 40px rgba(30, 20, 48, 0.16));
    }

    .screen-layer.fade-in {
      transform: scale(0.985);
      opacity: 0;
    }

    .screen-layer.to-left {
      transform: translate3d(-32%, 0, 0);
      opacity: 0.72;
      filter: brightness(0.96);
    }

    .screen-layer.to-right {
      transform: translate3d(100%, 0, 0);
      opacity: 0.92;
    }

    .screen-layer.to-left-soft {
      transform: translate3d(-42%, 0, 0);
      opacity: 0.78;
    }

    .screen-layer.to-right-soft {
      transform: translate3d(42%, 0, 0);
      opacity: 0.78;
    }

    .screen-layer.to-bottom {
      transform: translate3d(0, 100%, 0);
      opacity: 0.98;
      filter: drop-shadow(0 -18px 40px rgba(30, 20, 48, 0.14));
    }

    .screen-layer.fade-out {
      transform: scale(1.012);
      opacity: 0;
    }

    .screen-layer.dim-back {
      filter: brightness(0.88);
    }

    .screen-layer.content-fade-in,
    .screen-layer.content-fade-out {
      opacity: 0;
    }

    .screen-layer.clip-content {
      clip-path: inset(var(--clip-top, 408px) 0 0 0);
    }

    .screen-layer.clip-stable-top {
      clip-path: inset(0 0 calc(100% - var(--clip-top, 408px)) 0);
    }

    .screen-image {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspots {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .hotspot {
      position: absolute;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      touch-action: manipulation;
      border-radius: 16px;
    }

    .phone.is-transitioning .hotspot {
      pointer-events: none;
    }

    .phone.is-transitioning .motion-curve-grid,
    .phone.is-transitioning .motion-level-control,
    .phone.is-transitioning .scene-card,
    .phone.is-transitioning .night-light-switch,
    .phone.is-transitioning .night-light-slider-control,
    .phone.is-transitioning .monitoring-action-button {
      pointer-events: none;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(95, 49, 168, 0.08);
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .hotspot:active::after {
      opacity: 1;
      transform: scale(1);
    }

    .hotspot.is-power-toggle::after,
    .hotspot.is-power-toggle:active::after {
      opacity: 0;
      transform: none;
    }

    .hotspot.is-power-toggle:focus-visible {
      outline: none;
      background: transparent;
    }

    .hotspot:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
      background: rgba(95, 49, 168, 0.08);
    }

    .timer-control {
      position: absolute;
      z-index: 4;
      left: 28px;
      top: 467px;
      width: 100px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 11px;
      border: 0;
      border-radius: 999px;
      background: var(--timer-bg);
      color: var(--timer-color);
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 1px var(--timer-border);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    .timer-control.is-on {
      --timer-bg: #efeaff;
      --timer-border: #d8ccff;
      --timer-color: #562b96;
    }

    .timer-control.is-off {
      --timer-bg: #f5f4f6;
      --timer-border: #e6e1e8;
      --timer-color: #8a8290;
    }

    .timer-control::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(95, 49, 168, 0.1);
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .timer-control:active::after {
      opacity: 1;
      transform: scale(1);
    }

    .timer-control:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .power-hint {
      position: absolute;
      left: 315px;
      top: 446px;
      z-index: 4;
      width: 56px;
      height: 56px;
      pointer-events: none;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 220ms ease;
      transform-origin: 50% 50%;
    }

    .power-hint.is-visible {
      opacity: 1;
      animation: powerHintCirclePulse 1.5s ease-out 1;
    }

    .power-hint::before,
    .power-hint::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .power-hint::before {
      background: radial-gradient(circle, rgba(163, 122, 255, 0.18) 0%, rgba(163, 122, 255, 0.08) 48%, rgba(163, 122, 255, 0) 74%);
    }

    .power-hint::after {
      border: 2px solid rgba(141, 111, 247, 0.32);
      box-shadow: 0 0 0 0 rgba(141, 111, 247, 0.12);
    }

    @keyframes powerHintCirclePulse {
      0% {
        transform: scale(0.92);
        opacity: 0;
      }
      18% {
        opacity: 0.88;
      }
      58% {
        transform: scale(1.18);
        opacity: 0.56;
      }
      100% {
        transform: scale(1.28);
        opacity: 0;
      }
    }

    .timer-clock {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border: 1.25px solid currentColor;
      border-radius: 50%;
    }

    .timer-clock::before,
    .timer-clock::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 5px;
      width: 1.25px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      transform-origin: 1px 6px;
    }

    .timer-clock::after {
      top: 9px;
      height: 5px;
      transform: rotate(48deg);
    }

    .timer-value {
      position: relative;
      z-index: 1;
      min-width: 45px;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }

    .timer-options {
      position: absolute;
      left: 16px;
      top: 648px;
      z-index: 4;
      width: 370px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 11px;
    }

    .timer-option {
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: #f4f4f5;
      color: #251227;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 1px rgba(30, 20, 48, 0.03), 0 1px 2px rgba(30, 20, 48, 0.04);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .timer-option:active {
      transform: scale(0.97);
    }

    .timer-option.is-selected {
      background: #5d2fa2;
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 6px 16px rgba(93, 47, 162, 0.18);
    }

    .timer-option:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .motion-controls {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .motion-curve-grid {
      position: absolute;
      left: 16px;
      top: 414px;
      width: 370px;
      display: grid;
      grid-template-columns: repeat(3, 120px);
      gap: 16px 5px;
      pointer-events: auto;
    }

    .motion-curve-button {
      width: 120px;
      height: 94px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 15px 16px 14px;
      border: 1px solid #ecebed;
      border-radius: 16px;
      background: #fff;
      color: #28121f;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .motion-curve-button:active {
      transform: scale(0.97);
    }

    .motion-curve-button.is-selected {
      border-color: #e3d8ff;
      background: #f4efff;
      color: #5d2fa2;
    }

    .motion-curve-button:focus-visible,
    .motion-level-control:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .motion-curve-wave {
      width: 47px;
      height: 32px;
      color: inherit;
    }

    .motion-level-control {
      position: absolute;
      left: 16px;
      top: 702px;
      width: 370px;
      height: 38px;
      display: grid;
      grid-template-columns: repeat(5, 74px);
      padding: 0;
      border: 0;
      border-radius: 48px;
      background: #f5f1fb;
      color: #28121f;
      pointer-events: auto;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .motion-level-thumb {
      position: absolute;
      left: var(--motion-level-left, 222px);
      top: 0;
      width: 74px;
      height: 38px;
      border-radius: 48px;
      background: #5d2fa2;
      box-shadow: 0 6px 14px rgba(93, 47, 162, 0.18);
      transition: left 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .motion-level-segment {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border: 0;
      padding: 0;
      border-radius: 48px;
      background: transparent;
      color: inherit;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      transition: color 160ms ease;
    }

    .motion-level-segment.is-selected {
      color: #fff;
    }

    .sleep-mode-dynamic {
      position: absolute;
      inset: 0;
      z-index: 4;
      color: #5d2fa2;
      pointer-events: none;
    }

    .sleep-mode-dynamic.is-off {
      color: #a98ed5;
    }

    .sleep-mode-tile-card {
      position: absolute;
      top: 540px;
      width: 165px;
      height: 91px;
      border: 1px solid #eee7ff;
      border-radius: 16px;
      background: linear-gradient(135deg, #f9f7ff 0%, #eee8ff 100%);
      color: currentColor;
      pointer-events: none;
    }

    .sleep-mode-dynamic.is-off .sleep-mode-tile-card {
      background: #fff;
    }

    .sleep-mode-tile-card.is-motion {
      left: 32px;
    }

    .sleep-mode-tile-card.is-noise {
      left: 205px;
    }

    .sleep-mode-tile-icon {
      position: absolute;
      left: 24px;
      top: 20px;
      width: 24px;
      height: 24px;
      color: currentColor;
    }

    .sleep-mode-tile-arrow {
      position: absolute;
      right: 19px;
      top: 20px;
      color: currentColor;
      font: 400 36px/24px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .sleep-mode-tile-value {
      position: absolute;
      left: 24px;
      right: 16px;
      bottom: 17px;
      overflow: hidden;
      color: currentColor;
      font: 500 15px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scene-controls {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .scene-section-mask {
      position: absolute;
      left: 0;
      top: 648px;
      z-index: 1;
      width: 402px;
      height: 226px;
      background: #fff;
    }

    .scene-strip {
      position: absolute;
      left: 32px;
      top: 656px;
      z-index: 2;
      width: 338px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      pointer-events: auto;
    }

    .scene-card {
      min-width: 0;
      height: 60px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 4px;
      padding: 0 12px;
      border: 1px solid #eee7ff;
      border-radius: 16px;
      background: #fff;
      color: #3f3545;
      box-shadow: 0 1px 2px rgba(35, 26, 58, 0.03);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 120ms ease, box-shadow 180ms ease;
    }

    .scene-card:active {
      transform: scale(0.97);
    }

    .scene-card.is-selected {
      border-color: #ded2ff;
      background: #f4efff;
      color: #5d2fa2;
      box-shadow: 0 7px 16px rgba(93, 47, 162, 0.1);
    }

    .scene-card:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .scene-card-title {
      max-width: 100%;
      overflow: hidden;
      font: 650 15px/18px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scene-card-meta {
      max-width: 100%;
      overflow: hidden;
      color: #918898;
      font: 500 10px/14px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scene-card.is-selected .scene-card-meta {
      color: #7650ac;
    }

    .onboarding-screen {
      position: absolute;
      inset: 0;
      z-index: 4;
      background:
        radial-gradient(circle at top right, rgba(214, 202, 255, 0.78), transparent 34%),
        linear-gradient(180deg, #fdfcff 0%, #f8f4ff 42%, #f7f1ff 100%);
      color: #1e1a2a;
      overflow: hidden;
    }

    .onboarding-screen::before {
      content: "";
      position: absolute;
      inset: auto -80px -140px auto;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255, 226, 198, 0.34);
      filter: blur(6px);
      pointer-events: none;
    }

    .onboarding-head {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 72px;
      z-index: 2;
    }

    .onboarding-kicker {
      color: #7a68a8;
      font: 600 13px/18px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .onboarding-progress {
      margin-top: 18px;
      display: grid;
      gap: 8px;
    }

    .onboarding-progress-label {
      color: #8d7baa;
      font: 600 12px/16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .onboarding-progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(220, 211, 242, 0.78);
      overflow: hidden;
    }

    .onboarding-progress-fill {
      display: block;
      width: 33.333%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(135deg, #8d6ff7 0%, #a77bff 100%);
      transition: width 220ms ease;
    }

    .onboarding-title {
      margin-top: 14px;
      color: #1e1a2a;
      font: 650 26px/32px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .onboarding-copy {
      margin-top: 12px;
      max-width: 334px;
      color: #645f74;
      font: 400 15px/22px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .onboarding-step-stack {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 286px;
      bottom: 22px;
      z-index: 2;
    }

    .onboarding-step {
      display: none;
      flex-direction: column;
      gap: 14px;
      height: 100%;
    }

    .onboarding-step.is-active {
      display: flex;
    }

    .onboarding-step[data-step="1"] {
      padding-top: 44px;
    }

    .onboarding-step[data-step="3"] {
      padding-top: 18px;
    }

    .onboarding-card {
      position: relative;
      border: 1px solid rgba(192, 202, 228, 0.6);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 36px rgba(41, 38, 64, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
    }

    .onboarding-section-title {
      color: #7f7690;
      font: 600 12px/16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .onboarding-choice-list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .onboarding-link-button {
      margin-top: 14px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #7a5fe0;
      font: 600 14px/20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      text-align: left;
    }

    .onboarding-choice-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 96px;
      padding: 16px;
      border: 1px solid #e7edf8;
      border-radius: 22px;
      background: #fbfcff;
      color: #241e35;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 120ms ease;
    }

    .onboarding-choice-card:active {
      transform: scale(0.985);
    }

    .onboarding-choice-card.is-selected {
      border-color: #d4c4ff;
      background: #f7f2ff;
      box-shadow: 0 10px 24px rgba(128, 94, 214, 0.12);
    }

    .onboarding-choice-card:focus-visible,
    .onboarding-link-button:focus-visible,
    .onboarding-age-button:focus-visible,
    .onboarding-cta:focus-visible,
    .onboarding-secondary:focus-visible,
    .baby-sheet-input:focus-visible,
    .onboarding-scene-toggle:focus-visible {
      outline: 3px solid rgba(58, 120, 214, 0.38);
      outline-offset: 2px;
    }

    .onboarding-baby-avatar {
      width: 56px;
      height: 56px;
      border-radius: 20px;
      background: linear-gradient(145deg, #ffd5c8 0%, #ffe9dd 100%);
      color: #8f5260;
      font: 650 22px/56px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      text-align: center;
      flex: 0 0 auto;
    }

    .onboarding-choice-body,
    .onboarding-baby-profile {
      min-width: 0;
      flex: 1 1 auto;
    }

    .onboarding-baby-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .onboarding-choice-top {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .onboarding-baby-name {
      color: #21192b;
      font: 650 22px/28px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .onboarding-baby-pill {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: #f2f4fb;
      color: #69748f;

    function showScreen(name, transitionName = "fade") {
      const screen = screens[name];
      if (!screen || transitionLocked) return;
      if (name === currentScreen && activeLayer) {
        renderHud(screen);
        return;
      }

      const transition = activeLayer ? transitions[transitionName] || transitions.fade : transitions.none;
      const previousScreen = screens[currentScreen];
      if (activeLayer && transition.contentOnly && previousScreen?.stableTop && screen.stableTop) {
        showContentTabScreen(name, screen, previousScreen, transition);
        return;
      }

      const previousLayer = activeLayer;
      const nextLayer = createLayer(screen);
      const hasMotion = transition.duration > 0;

      currentScreen = name;
      phone.style.setProperty("--screen-w", `${screen.width}px`);
      phone.style.setProperty("--screen-h", `${screen.height}px`);
      phone.style.setProperty("--screen-ratio", screen.height / screen.width);
      renderHud(screen);

      nextLayer.style.setProperty("--motion-duration", `${transition.duration}ms`);
      if (previousLayer) {
        previousLayer.style.setProperty("--motion-duration", `${transition.duration}ms`);
      }

      if (transition.nextFrom) {
        nextLayer.classList.add(transition.nextFrom);
      }

      if (!previousLayer || !hasMotion) {
        screenStack.replaceChildren(nextLayer);
        nextLayer.classList.remove("no-motion");
        activeLayer = nextLayer;
        updateTimerDisplays();
        updatePowerHint(activeLayer);
        return;
      }

      transitionLocked = true;
      phone.classList.add("is-transitioning");

      if (transition.placeNextBelow) {
        nextLayer.style.zIndex = "1";
        previousLayer.style.zIndex = "2";
        screenStack.insertBefore(nextLayer, previousLayer);
      } else {
        previousLayer.style.zIndex = "1";
        nextLayer.style.zIndex = "2";
        screenStack.appendChild(nextLayer);
      }

      nextLayer.getBoundingClientRect();
      requestAnimationFrame(() => {
        nextLayer.classList.remove(transition.nextFrom);
        if (transition.prevTo) {
          previousLayer.classList.add(transition.prevTo);
        }
      });

      window.setTimeout(() => {
        screenStack.replaceChildren(nextLayer);
        nextLayer.className = "screen-layer";
        nextLayer.style.zIndex = "";
        activeLayer = nextLayer;
        transitionLocked = false;
        phone.classList.remove("is-transitioning");
        updateTimerDisplays();
        updatePowerHint(activeLayer);
      }, transition.duration + 40);
    }

    function showContentTabScreen(name, screen, previousScreen, transition) {
      const previousLayer = activeLayer;
      const nextLayer = createLayer(screen);
      const stableTopLayer = createLayer(previousScreen, { hotspots: false, overlays: false });
      const clipTop = screen.stableTop || previousScreen.stableTop;

      currentScreen = name;
      phone.style.setProperty("--screen-w", `${screen.width}px`);
      phone.style.setProperty("--screen-h", `${screen.height}px`);
      phone.style.setProperty("--screen-ratio", screen.height / screen.width);
      renderHud(screen);

      transitionLocked = true;
      phone.classList.add("is-transitioning");

      for (const layer of [previousLayer, nextLayer, stableTopLayer]) {
        layer.style.setProperty("--motion-duration", `${transition.duration}ms`);
        layer.style.setProperty("--clip-top", `${clipTop}px`);
      }

      previousLayer.classList.add("clip-content");
      previousLayer.style.zIndex = "1";
      nextLayer.classList.add("clip-content", transition.nextFrom);
      nextLayer.style.zIndex = "2";
      stableTopLayer.classList.add("clip-stable-top");
      stableTopLayer.style.zIndex = "3";

      screenStack.appendChild(nextLayer);
      screenStack.appendChild(stableTopLayer);

      nextLayer.getBoundingClientRect();
      requestAnimationFrame(() => {
        nextLayer.classList.remove(transition.nextFrom);
        previousLayer.classList.add(transition.prevTo);
      });

      window.setTimeout(() => {
        nextLayer.className = "screen-layer";
        nextLayer.style.zIndex = "";
        screenStack.replaceChildren(nextLayer);
        activeLayer = nextLayer;
        transitionLocked = false;
        phone.classList.remove("is-transitioning");
        updateTimerDisplays();
        updatePowerHint(activeLayer);
      }, transition.duration + 40);
    }

    function createLayer(screen, options = {}) {
      const withHotspots = options.hotspots !== false;
      const withOverlays = options.overlays !== false;
      const layer = document.createElement("div");
      layer.className = "screen-layer";

      if (screen.image) {
        const image = document.createElement("img");
        image.className = "screen-image";
        image.src = screen.image;
        image.alt = screen.alt;
        layer.appendChild(image);
      }

      if (withOverlays) {
        renderOverlays(screen, layer);
      }

      if (withHotspots) {
        const hotspotLayer = document.createElement("div");
        hotspotLayer.className = "hotspots";
        for (const spot of screen.hotspots) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "hotspot";
          if (spot.label === "切换总开关" || spot.label === "打开总开关") {
            button.classList.add("is-power-toggle");
          }
          button.setAttribute("aria-label", spot.label);
          button.title = spot.label;
          button.style.left = `${(spot.x / screen.width) * 100}%`;
          button.style.top = `${(spot.y / screen.height) * 100}%`;
          button.style.width = `${(spot.w / screen.width) * 100}%`;
          button.style.height = `${(spot.h / screen.height) * 100}%`;
          button.addEventListener("click", spot.action);
          hotspotLayer.appendChild(button);
        }
        layer.appendChild(hotspotLayer);
      }
      return layer;
    }

          pendingDurationMinutes = selectedDurationMinutes;

        optionGrid.className = "timer-options";

          optionGrid.appendChild(button);

        layer.appendChild(optionGrid);
        updateTimerOptionButtons(optionGrid);

        const dynamic = document.createElement("div");
        dynamic.className = `sleep-mode-dynamic ${powerOn ? "is-on" : "is-off"}`;

    function takeMonitoringSnapshot() {
      const layer = activeLayer;
      if (!layer || currentScreen !== "monitoring") return;

      for (const preview of layer.querySelectorAll(".monitoring-snapshot-preview")) {
        preview.remove();
      }

      const preview = document.createElement("div");
      preview.className = "monitoring-snapshot-preview";
      layer.appendChild(preview);
      preview.getBoundingClientRect();

      requestAnimationFrame(() => {
        preview.classList.add("is-minimized");
      });

      window.setTimeout(() => {
        preview.classList.add("is-dismissed");
      }, 780);

      window.setTimeout(() => {
        preview.remove();
      }, 1120);
    }

    function toggleMonitoringRecording() {

    function updateMonitoringControls(root = document) {
      for (const button of root.querySelectorAll(".monitoring-record-button")) {
        button.classList.toggle("is-recording", monitoringRecording);
        button.setAttribute("aria-label", monitoringRecording ? "结束录屏" : "开始录屏");
        button.title = monitoringRecording ? "结束录屏" : "开始录屏";
        button.setAttribute("aria-pressed", String(monitoringRecording));
      }

      for (const badge of root.querySelectorAll(".monitoring-recording-badge")) {
        badge.classList.toggle("is-visible", monitoringRecording);
      }
    }

      if (powerOn) {
        resetCountdown(selectedDurationMinutes);

      }
      updateSleepModeDynamic();

    function createNightLightSwitch() {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "night-light-switch";
      button.setAttribute("aria-label", "切换夜灯");
      button.addEventListener("click", () => {
        setNightLightPower(!nightLightOn);
      });
      return button;
    }

    function createNightLightSlider(config) {
      const slider = document.createElement("div");
      slider.className = `night-light-slider-control${config.type === "temperature" ? " is-temperature" : ""}`;
      slider.tabIndex = 0;
      slider.dataset.type = config.type;
      slider.dataset.min = String(config.min);
      slider.dataset.max = String(config.max);
      slider.dataset.step = String(config.step);
      slider.style.setProperty("--night-light-slider-top", `${config.top}px`);
      slider.setAttribute("role", "slider");
      slider.setAttribute("aria-label", config.label);
      slider.setAttribute("aria-valuemin", String(config.min));
      slider.setAttribute("aria-valuemax", String(config.max));
      slider.innerHTML = `
        <span class="night-light-slider-label">${config.label}</span>
        <span class="night-light-slider-value"></span>
        <div class="night-light-slider-track"><div class="night-light-slider-fill"></div></div>
        <div class="night-light-slider-thumb"></div>
        <span class="night-light-slider-hint is-min">${config.minLabel}</span>
        <span class="night-light-slider-hint is-max">${config.maxLabel}</span>`;

      let isDragging = false;
      const setFromPointer = (event) => {
        const rect = slider.getBoundingClientRect();
        const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
        const rawValue = config.min + ratio * (config.max - config.min);
        config.setValue(roundToStep(rawValue, config.step));
      };

      slider.addEventListener("pointerdown", (event) => {
        if (!nightLightOn) return;
        isDragging = true;
        slider.setPointerCapture?.(event.pointerId);
        setFromPointer(event);
      });
      slider.addEventListener("pointermove", (event) => {
        if (isDragging) setFromPointer(event);
      });
      slider.addEventListener("pointerup", (event) => {
        isDragging = false;
        slider.releasePointerCapture?.(event.pointerId);
      });
      slider.addEventListener("pointercancel", () => {
        isDragging = false;
      });
      slider.addEventListener("keydown", (event) => {
        if (!nightLightOn) return;
        const currentValue = config.getValue();
        if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
          event.preventDefault();
          config.setValue(currentValue - config.step);
        }
        if (event.key === "ArrowRight" || event.key === "ArrowUp") {
          event.preventDefault();
          config.setValue(currentValue + config.step);
        }
      });

      return slider;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    }

    function createBabyIdFromName(name) {
      const normalized = (name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
      const base = normalized || `baby-${Date.now()}`;
      let nextId = base;
      let suffix = 2;
      while (babies.some((baby) => baby.id === nextId)) {
        nextId = `${base}-${suffix}`;
        suffix += 1;
      }
      return nextId;
    }

    function getBabyAvatar(name) {
      const firstChar = String(name || "").trim().charAt(0);
      return firstChar ? firstChar.toUpperCase() : "B";

      list.innerHTML = getBabyChoiceMarkup();

        button.addEventListener("click", () => selectBabyProfile(button.dataset.babyId || babies[0].id));

      updateOnboardingDisplays(root);

        selectedBabyId = babies[0].id;

      onboardingStep = 1;

    function addBabyProfile(name, months) {
      const trimmedName = String(name || "").trim();
      const safeMonths = clamp(Math.round(months), 0, 24);
      if (!trimmedName) return false;
      const nextId = createBabyIdFromName(trimmedName);
      babies.push({
        id: nextId,
        name: trimmedName,
        note: `${safeMonths} 个月，等待进一步完善这位宝宝的专属安抚偏好。`,
        avatar: getBabyAvatar(trimmedName)
      });
      babyAgeById[nextId] = safeMonths;
      selectedBabyId = nextId;
      selectedBabyAgeMonths = safeMonths;
      pendingBabyName = "";
      pendingBabyAge = 3;
      rebuildOnboardingBabyChoices();
      persistPrototypeState();
      return true;
    }

    function applySceneToGeneral(sceneId, { setActive = true } = {}) {
      const source = scenes.find((scene) => scene.id === sceneId);
      const general = scenes.find((scene) => scene.id === "general");
      if (!source || !general) return;
      general.mode = source.mode;
      general.curve = source.curve;
      general.movementPath = source.movementPath;
      general.motionLevel = source.motionLevel;
      general.realtimeMonitoring = source.realtimeMonitoring;
      general.track = source.track;
      general.volume = source.volume;
      general.loopMode = source.loopMode;
      general.meta = `${source.movementPath.replace("Curve ", "C")} · ${source.track.replace("Ocean Waves", "Ocean").replace("Moon Lullaby", "Lullaby").replace("Cotton Cloud", "Cloud")}`;
      if (setActive) {
        selectScene("general");
      } else {
        updateSceneControls();
        updateSleepModeDynamic();
      }
    }

    function applyRecommendedOnboarding() {
      const recommendation = getRecommendedProfile();
      applySceneToGeneral(recommendation.sceneId, { setActive: true });
      completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
      cribOnboardingCompleted = true;
      persistPrototypeState();
      showScreen(powerOn ? "soothing" : "soothingOff", "push");
    }

    function updateOnboardingDisplays(root = document) {
      const baby = getSelectedBaby();
      const recommendation = getRecommendedProfile();
      const scene = scenes.find((item) => item.id === recommendation.sceneId) || scenes[0];
      const stepMeta = {
        1: {
          progress: "步骤 1 / 3",
          title: "欢迎使用智能婴儿床，请确认要守护的宝宝",
          copy: "我们将按照宝宝的当前月龄推荐更合适的服务方案"
        },
        2: {
          progress: "步骤 2 / 3",
          title: `确认 ${baby.name} 的月龄`,
          copy: `当前系统记录为 ${selectedBabyAgeMonths} 个月。月龄不准确的话，先改掉，再继续往下推荐。`
        },
        3: {
          progress: "步骤 3 / 3",
          title: `先给 ${baby.name} 一套更适合的哄睡起步方案`,
          copy: "我们会根据当前月龄的睡眠特点，推荐更合适的运动轨迹、运动档位、白噪音类型和音量，并在确认后写入“通用卡”。"
        }
      };
      const currentStep = stepMeta[onboardingStep] || stepMeta[1];

      for (const value of root.querySelectorAll("#onboardingProgressLabel")) {
        value.textContent = currentStep.progress;
      }
      for (const value of root.querySelectorAll("#onboardingProgressFill")) {
        value.style.width = `${(onboardingStep / 3) * 100}%`;
      }
      for (const value of root.querySelectorAll("#onboardingTitle")) {
        value.textContent = currentStep.title;
      }
      for (const value of root.querySelectorAll("#onboardingCopy")) {
        value.textContent = currentStep.copy;
      }
      for (const step of root.querySelectorAll(".onboarding-step")) {
        step.classList.toggle("is-active", Number(step.dataset.step) === onboardingStep);
      }
      for (const card of root.querySelectorAll(".onboarding-choice-card")) {
        const babyId = card.dataset.babyId;
        const isSelected = babyId === selectedBabyId;
        card.classList.toggle("is-selected", isSelected);
        card.setAttribute("aria-pressed", String(isSelected));
      }
      for (const value of root.querySelectorAll("[data-baby-age]")) {
        const babyId = value.getAttribute("data-baby-age");
        if (babyId) {
          value.textContent = `${getBabyAgeForId(babyId)}个月`;
        }
      }
      for (const value of root.querySelectorAll("#onboardingBabyAvatar")) {
        value.textContent = baby.avatar;
      }
      for (const value of root.querySelectorAll("#onboardingBabyName")) {
        value.textContent = baby.name;
      }
      for (const value of root.querySelectorAll("#onboardingBabyNote")) {
        value.textContent = baby.note;
      }
      for (const value of root.querySelectorAll("#onboardingBabyAgePill")) {
        value.textContent = `${selectedBabyAgeMonths}个月`;
      }
      for (const value of root.querySelectorAll("#onboardingAgeValue")) {
        value.textContent = String(selectedBabyAgeMonths);
      }
      for (const value of root.querySelectorAll("#onboardingRecommendTitle")) {
        value.textContent = recommendation.title;
      }
      for (const value of root.querySelectorAll("#onboardingRecommendCopy")) {
        value.textContent = recommendation.copy;
      }
      for (const value of root.querySelectorAll("#onboardingSceneName")) {
        value.textContent = scene.title;
      }
      for (const value of root.querySelectorAll("#onboardingSceneMode")) {
        value.textContent = scene.mode;
      }
      for (const value of root.querySelectorAll("#onboardingSceneCurve")) {
        value.textContent = scene.movementPath;
      }
      for (const value of root.querySelectorAll("#onboardingSceneLevel")) {
        value.textContent = `Level ${scene.motionLevel}`;
      }
      for (const value of root.querySelectorAll("#onboardingSceneTrack")) {
        value.textContent = scene.track;
      }
      for (const value of root.querySelectorAll("#onboardingSceneVolume")) {
        value.textContent = `${scene.volume}%`;
      }
      for (const panel of root.querySelectorAll("#onboardingScenePanel")) {
        panel.classList.toggle("is-open", onboardingSceneExpanded);
      }
      for (const toggle of root.querySelectorAll("#onboardingSceneToggle")) {
        toggle.textContent = onboardingSceneExpanded ? "−" : "+";
        toggle.setAttribute("aria-expanded", String(onboardingSceneExpanded));
      }
      for (const sheet of root.querySelectorAll(".age-sheet-options")) {
        if (!sheet.style.display) {
          sheet.style.display = "none";
        }
      }
      for (const option of root.querySelectorAll(".age-sheet-option")) {
        option.classList.toggle("is-selected", Number(option.dataset.months) === selectedBabyAgeMonths);
      }
    }

    function setupOnboardingFlow(layer) {
      const babyChoiceButtons = layer.querySelectorAll(".onboarding-choice-card");
      const addBabyButton = layer.querySelector("#onboardingAddBabyButton");
      const step1NextButton = layer.querySelector("#onboardingStep1Next");
      const ageButton = layer.querySelector("#onboardingAgeButton");
      const ageConfirmButton = layer.querySelector("#onboardingAgeConfirmButton");
      const backToBabyButton = layer.querySelector("#onboardingBackToBabyButton");
      const sceneToggle = layer.querySelector("#onboardingSceneToggle");
      const applyButton = layer.querySelector("#onboardingApplyButton");
      const backToAgeButton = layer.querySelector("#onboardingBackToAgeButton");
      const ageSheet = layer.querySelector(".age-sheet-options");
      const ageGrid = layer.querySelector("#ageSheetGrid");
      const scrim = layer.querySelector(".onboarding-scrim");
      const addBabySheets = layer.querySelectorAll(".age-sheet-options");
      const addBabySheet = addBabySheets[1];
      const addBabyScrim = addBabySheet?.querySelector(".onboarding-scrim");
      const babyNameInput = layer.querySelector("#babySheetNameInput");
      const babyAgeGrid = layer.querySelector("#babySheetAgeGrid");
      const babyConfirmButton = layer.querySelector("#babySheetConfirmButton");
      const babyCancelButton = layer.querySelector("#babySheetCancelButton");

      for (const button of babyChoiceButtons) {
        button.addEventListener("click", () => selectBabyProfile(button.dataset.babyId || babies[0].id));
      }
      const updateAddBabySheet = () => {
        if (babyNameInput) babyNameInput.value = pendingBabyName;
        if (babyConfirmButton) babyConfirmButton.disabled = !String(pendingBabyName || "").trim();
        if (babyAgeGrid) {
          for (const option of babyAgeGrid.querySelectorAll(".age-sheet-option")) {
            option.classList.toggle("is-selected", Number(option.dataset.months) === pendingBabyAge);
          }
        }
      };
      const toggleAddBabySheet = (force) => {
        if (!addBabySheet) return;
        const nextVisible = typeof force === "boolean" ? force : addBabySheet.style.display === "none";
        if (nextVisible && ageSheet) ageSheet.style.display = "none";
        addBabySheet.style.display = nextVisible ? "grid" : "none";
        if (nextVisible) {
          updateAddBabySheet();
          babyNameInput?.focus();
        }
      };
      if (addBabyButton) addBabyButton.addEventListener("click", () => toggleAddBabySheet(true));
      if (step1NextButton) step1NextButton.addEventListener("click", () => goToOnboardingStep(2));
      if (ageButton) ageButton.addEventListener("click", () => toggleAgeSheet());
      if (ageConfirmButton) ageConfirmButton.addEventListener("click", () => goToOnboardingStep(3));
      if (backToBabyButton) backToBabyButton.addEventListener("click", () => goToOnboardingStep(1));
      if (sceneToggle) sceneToggle.addEventListener("click", toggleOnboardingSceneDetails);
      if (applyButton) applyButton.addEventListener("click", applyRecommendedOnboarding);
      if (backToAgeButton) backToAgeButton.addEventListener("click", () => goToOnboardingStep(2));
      if (scrim) scrim.addEventListener("click", () => toggleAgeSheet(false));
      if (addBabyScrim) addBabyScrim.addEventListener("click", () => toggleAddBabySheet(false));
      if (babyCancelButton) babyCancelButton.addEventListener("click", () => toggleAddBabySheet(false));

      if (ageGrid) {
        for (const months of [1, 2, 3, 4, 5, 6, 9, 12]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "age-sheet-option";
          button.dataset.months = String(months);
          button.textContent = String(months);
          button.addEventListener("click", () => setBabyAge(months));
          ageGrid.appendChild(button);
        }
      }

      if (babyAgeGrid) {
        for (const months of [1, 2, 3, 4, 5, 6, 9, 12]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "age-sheet-option";
          button.dataset.months = String(months);
          button.textContent = String(months);
          button.addEventListener("click", () => {
            pendingBabyAge = months;
            updateAddBabySheet();
          });
          babyAgeGrid.appendChild(button);
        }
      }

      if (babyNameInput) {
        babyNameInput.addEventListener("input", () => {
          pendingBabyName = babyNameInput.value;
          updateAddBabySheet();
        });
      }

      if (babyConfirmButton) {
        babyConfirmButton.addEventListener("click", () => {
          if (!addBabyProfile(pendingBabyName, pendingBabyAge)) return;
          toggleAddBabySheet(false);
          toast(`已添加 ${getSelectedBaby().name}`);
        });
      }

      if (ageSheet && !ageSheet.style.display) {
        ageSheet.style.display = "none";
      }
      if (addBabySheets[1] && !addBabySheets[1].style.display) {
        addBabySheets[1].style.display = "none";
      }

      updateOnboardingDisplays(layer);
    }

    function persistPrototypeState() {
      try {
        localStorage.setItem("cribPrototypeState", JSON.stringify({
          powerOn,
          selectedDurationMinutes,
          remainingSeconds,
          selectedCurve,
          motionLevel,
          realtimeMonitoring,
          activeTrack,
          noiseVolume,
          loopMode,
          selectedSceneId,
          nightLightOn,
          nightLightBrightness,
          nightLightTemperature,
          cribOnboardingCompleted,
          completedOnboardingVersion,
          selectedBabyId,
          selectedBabyAgeMonths,
          powerHintShown,
          babies,
          babyAgeById,
          onboardingSceneExpanded,
          scenes
        }));
      } catch {}
    }

    function loadPrototypeState() {
      try {
        const saved = JSON.parse(localStorage.getItem("cribPrototypeState") || "null");
        if (!saved || typeof saved !== "object") return;
        if (typeof saved.powerOn === "boolean") powerOn = saved.powerOn;
        if (typeof saved.selectedDurationMinutes === "number") selectedDurationMinutes = saved.selectedDurationMinutes;
        if (typeof saved.remainingSeconds === "number") remainingSeconds = saved.remainingSeconds;
        if (typeof saved.selectedCurve === "number") selectedCurve = saved.selectedCurve;
        if (typeof saved.motionLevel === "number") motionLevel = saved.motionLevel;
        if (typeof saved.realtimeMonitoring === "boolean") realtimeMonitoring = saved.realtimeMonitoring;
        if (typeof saved.activeTrack === "string") activeTrack = saved.activeTrack;
        if (typeof saved.noiseVolume === "number") noiseVolume = saved.noiseVolume;
        if (typeof saved.loopMode === "string") loopMode = saved.loopMode;
        if (typeof saved.selectedSceneId === "string") selectedSceneId = saved.selectedSceneId;
        if (typeof saved.nightLightOn === "boolean") nightLightOn = saved.nightLightOn;
        if (typeof saved.nightLightBrightness === "number") nightLightBrightness = saved.nightLightBrightness;
        if (typeof saved.nightLightTemperature === "number") nightLightTemperature = saved.nightLightTemperature;
        if (typeof saved.powerHintShown === "boolean") powerHintShown = saved.powerHintShown;
        if (Array.isArray(saved.babies)) {
          babies.length = 0;
          for (const persistedBaby of saved.babies) {
            if (!persistedBaby || typeof persistedBaby !== "object") continue;
            if (typeof persistedBaby.id !== "string" || typeof persistedBaby.name !== "string") continue;
            babies.push({
              id: persistedBaby.id,
              name: persistedBaby.name,
              note: typeof persistedBaby.note === "string" ? persistedBaby.note : "等待进一步完善这位宝宝的专属安抚偏好。",
              avatar: typeof persistedBaby.avatar === "string" ? persistedBaby.avatar : getBabyAvatar(persistedBaby.name)
            });
          }
        }
        if (saved.babyAgeById && typeof saved.babyAgeById === "object") {
          for (const baby of babies) {
            if (typeof saved.babyAgeById[baby.id] === "number") {
              babyAgeById[baby.id] = saved.babyAgeById[baby.id];
            }
          }
        }
        if (typeof saved.completedOnboardingVersion === "number") completedOnboardingVersion = saved.completedOnboardingVersion;
        if (typeof saved.selectedBabyId === "string" && babies.some((baby) => baby.id === saved.selectedBabyId)) {
          selectedBabyId = saved.selectedBabyId;
        }
        if (!saved.babyAgeById && typeof saved.selectedBabyAgeMonths === "number") {
          babyAgeById[selectedBabyId] = saved.selectedBabyAgeMonths;
        }
        selectedBabyAgeMonths = getBabyAgeForId(selectedBabyId);
        if (typeof saved.cribOnboardingCompleted === "boolean") {
          cribOnboardingCompleted = saved.cribOnboardingCompleted && completedOnboardingVersion >= ONBOARDING_FLOW_VERSION;
        }
        if (typeof saved.onboardingSceneExpanded === "boolean") onboardingSceneExpanded = saved.onboardingSceneExpanded;
        if (Array.isArray(saved.scenes)) {
          for (const persisted of saved.scenes) {
            const localScene = scenes.find((scene) => scene.id === persisted.id);
            if (!localScene) continue;
            Object.assign(localScene, persisted);
          }
        }
      } catch {}
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function roundToStep(value, step) {
      return Math.round(value / step) * step;
    }

    function setMotionLevel(level) {
      motionLevel = clamp(level, 0, 4);
      getActiveScene().motionLevel = motionLevel;
      updateMotionControlDisplays();
      updateSleepModeDynamic();
      persistPrototypeState();
    }

    function getActiveScene() {
      return scenes.find((scene) => scene.id === selectedSceneId) || scenes[0];
    }

    function selectScene(sceneId) {
      const scene = scenes.find((item) => item.id === sceneId);
      if (!scene) return;
      selectedSceneId = scene.id;
      selectedCurve = scene.curve;
      motionLevel = scene.motionLevel;
      realtimeMonitoring = scene.realtimeMonitoring;
      activeTrack = scene.track;
      noiseVolume = scene.volume;
      loopMode = scene.loopMode;
      noisePlaying = true;
      updateSceneControls();
      updateSleepModeDynamic();
      updateMotionControlDisplays();
      renderHud(screens[currentScreen]);
      persistPrototypeState();
    }

    function setNightLightBrightness(value) {
      nightLightBrightness = clamp(Math.round(value), 0, 100);
      updateNightLightControls();
      persistPrototypeState();
    }

    function setNightLightTemperature(value) {
      nightLightTemperature = clamp(roundToStep(value, 100), 2700, 5500);
      updateNightLightControls();
      persistPrototypeState();
    }

    function setNightLightPower(nextPower) {
      if (nightLightOn === nextPower) return;
      nightLightOn = nextPower;
      updateNightLightControls();
      persistPrototypeState();
    }

    function updateMotionControlDisplays(root = document) {
      for (const button of root.querySelectorAll(".motion-curve-button")) {
        const isSelected = Number(button.dataset.curve) === selectedCurve;
        button.classList.toggle("is-selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      }

      for (const control of root.querySelectorAll(".motion-level-control")) {
        control.style.setProperty("--motion-level-left", `${motionLevel * 74}px`);
        control.setAttribute("aria-valuenow", String(motionLevel));
        control.setAttribute("aria-valuetext", motionLevel === 0 ? "Off" : `Level ${motionLevel}`);
        for (const segment of control.querySelectorAll(".motion-level-segment")) {
          segment.classList.toggle("is-selected", Number(segment.dataset.level) === motionLevel);
        }
      }
    }

    function updateSceneControls(root = document) {
      for (const button of root.querySelectorAll(".scene-card")) {
        const scene = scenes.find((item) => item.id === button.dataset.sceneId);
        const isSelected = button.dataset.sceneId === selectedSceneId;
        button.classList.toggle("is-selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
        if (scene) {
          const meta = button.querySelector(".scene-card-meta");
          if (meta) {
            meta.textContent = `${scene.movementPath.replace("Curve ", "C")} · ${scene.track.replace("Ocean Waves", "Ocean").replace("Moon Lullaby", "Lullaby").replace("Cotton Cloud", "Cloud")}`;
          }
        }
      }
    }

    function updateSleepModeDynamic(root = document) {
      const scene = getActiveScene();
      for (const dynamic of root.querySelectorAll(".sleep-mode-dynamic")) {
        dynamic.classList.toggle("is-on", powerOn);
        dynamic.classList.toggle("is-off", !powerOn);
      }

      for (const value of root.querySelectorAll(".sleep-mode-tile-card.is-motion .sleep-mode-tile-value")) {
        value.textContent = scene.movementPath;
      }

      for (const value of root.querySelectorAll(".sleep-mode-tile-card.is-noise .sleep-mode-tile-value")) {
        value.textContent = activeTrack;
      }
    }

    function updatePowerHint(root = document) {
      const shouldShow = cribOnboardingCompleted && !powerOn && !powerHintShown && (currentScreen === "soothing" || currentScreen === "soothingOff");
      const hints = root.matches?.(".power-hint")
        ? [root, ...root.querySelectorAll(".power-hint")]
        : [...root.querySelectorAll(".power-hint")];
      for (const hint of hints) {
        hint.classList.toggle("is-visible", shouldShow);
      }
      window.clearTimeout(powerHintTimer);
      if (shouldShow) {
        powerHintShown = true;
        persistPrototypeState();
        powerHintTimer = window.setTimeout(() => {
          for (const hint of document.querySelectorAll(".power-hint")) {
            hint.classList.remove("is-visible");
          }
        }, 1600);
      }
    }

    function updateNightLightControls(root = document) {
      const controlRoots = root.matches?.(".night-light-controls")
        ? [root, ...root.querySelectorAll(".night-light-controls")]
        : [...root.querySelectorAll(".night-light-controls")];

      for (const controls of controlRoots) {
        controls.classList.toggle("is-off", !nightLightOn);
      }

      for (const value of root.querySelectorAll(".night-light-title-value")) {
        value.textContent = `${nightLightBrightness}%`;
      }

      for (const button of root.querySelectorAll(".night-light-switch")) {
        button.classList.toggle("is-off", !nightLightOn);
        button.setAttribute("aria-pressed", String(nightLightOn));
      }

      for (const slider of root.querySelectorAll(".night-light-slider-control")) {
        const isTemperature = slider.dataset.type === "temperature";
        const min = Number(slider.dataset.min);
        const max = Number(slider.dataset.max);
        const value = isTemperature ? nightLightTemperature : nightLightBrightness;
        const displayValue = isTemperature ? `${value}K` : `${value}%`;
        const ratio = clamp((value - min) / (max - min), 0, 1);
        const trackWidth = 338;
        const fillWidth = ratio * trackWidth;
        slider.style.setProperty("--night-light-fill-width", `${fillWidth}px`);
        slider.style.setProperty("--night-light-thumb-left", `${fillWidth - 14}px`);
        slider.setAttribute("aria-valuenow", String(value));
        slider.setAttribute("aria-valuetext", displayValue);
        const valueLabel = slider.querySelector(".night-light-slider-value");
        if (valueLabel) {
          valueLabel.textContent = displayValue;
        }
      }
    }

    function renderHud(screen) {
      const mode = powerOn ? "On" : "Off";
      const loop = loopMode === "whole" ? "Whole Playlist" : "One Song";
      hud.innerHTML = `<strong>${screen.label}</strong><span>Power ${mode}</span><span>Noise ${noisePlaying ? "Playing" : "Paused"}</span><span>${loop}</span>`;
    }

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("is-visible");
      }, 1200);
      renderHud(screens[currentScreen]);
    }

    function formatCountdown(seconds) {
      const safeSeconds = Math.max(0, seconds);
      const minutes = Math.floor(safeSeconds / 60);
      const remainder = safeSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
    }

    function getCountdownDisplaySeconds() {
      return powerOn ? remainingSeconds : selectedDurationMinutes * 60;
    }

    function updateTimerDisplays() {
      for (const button of document.querySelectorAll(".timer-control")) {
        button.classList.toggle("is-on", powerOn);
        button.classList.toggle("is-off", !powerOn);
      }
      for (const value of document.querySelectorAll(".timer-value")) {
        value.textContent = formatCountdown(getCountdownDisplaySeconds());
      }
      updateTimerOptionButtons();
    }

    function updateTimerOptionButtons(root = document) {
      for (const button of root.querySelectorAll(".timer-option")) {
        button.classList.toggle("is-selected", Number(button.dataset.minutes) === pendingDurationMinutes);
      }
    }

    function stopCountdown() {
      window.clearInterval(countdownInterval);
      countdownInterval = null;
    }

    function startCountdown() {
      stopCountdown();
      if (!powerOn) return;
      countdownInterval = window.setInterval(() => {
        if (!powerOn) {
          stopCountdown();
          return;
        }
        if (remainingSeconds > 0) {
          remainingSeconds -= 1;
          updateTimerDisplays();
        } else {
          stopCountdown();
        }
      }, 1000);
    }

    function resetCountdown(minutes) {
      remainingSeconds = minutes * 60;
      updateTimerDisplays();
      startCountdown();
      persistPrototypeState();
    }

    loadPrototypeState();
    showScreen(currentScreen, "none");
    updateTimerDisplays();
  </script>
</body>
</html>
