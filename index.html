<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figma Baby Crib Interactive Prototype</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef0f6;
      color: #1b1523;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 24px;
    }

    .stage {
      display: grid;
      grid-template-columns: 260px minmax(520px, 1fr) 360px;
      gap: 24px;
      width: min(100%, 1440px);
      height: calc(100vh - 48px);
      align-items: stretch;
      overflow: hidden;
    }

    .workspace-sidebar,
    .requirement-panel,
    .demo-panel {
      min-height: 0;
      border: 1px solid rgba(96, 74, 134, 0.08);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 48px rgba(31, 28, 46, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .workspace-sidebar,
    .requirement-panel {
      padding: 24px;
    }

    .sidebar-kicker,
    .requirement-kicker,
    .demo-kicker {
      color: #7a68a8;
      font: 600 12px/16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .sidebar-title,
    .requirement-title,
    .demo-title {
      margin: 10px 0 0;
      color: #201929;
      font: 650 24px/30px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .sidebar-copy,
    .requirement-copy,
    .demo-copy {
      margin: 10px 0 0;
      color: #6c6479;
      font: 400 14px/21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .workspace-nav {
      margin-top: 24px;
      display: grid;
      gap: 12px;
    }

    .workspace-nav-button {
      width: 100%;
      min-height: 92px;
      display: grid;
      gap: 6px;
      justify-items: start;
      padding: 18px;
      border: 1px solid #ebe4fb;
      border-radius: 18px;
      background: #fff;
      color: #21192b;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 120ms ease;
    }

    .workspace-nav-button:active {
      transform: scale(0.985);
    }

    .workspace-nav-button.is-active {
      border-color: #d4c4ff;
      background: #f7f2ff;
      box-shadow: 0 10px 24px rgba(128, 94, 214, 0.12);
    }

    .workspace-nav-button:focus-visible {
      outline: 3px solid rgba(58, 120, 214, 0.36);
      outline-offset: 2px;
    }

    .workspace-nav-title {
      font: 650 18px/24px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .workspace-nav-meta {
      color: #7e758a;
      font: 400 13px/19px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .demo-panel {
      padding: 24px 24px 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      align-items: start;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .demo-panel-head {
      width: 100%;
      display: grid;
      gap: 8px;
    }

    .demo-panel-frame {
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: start center;
      padding: 16px 0 0;
      overflow: visible;
    }

    .phone-frame {
      width: fit-content;
      max-width: none;
      display: grid;
      justify-items: center;
      gap: 14px;
      transform: scale(0.8);
      transform-origin: top center;
    }

    .requirement-panel {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      overflow: hidden;
    }

    .requirement-body {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 14px;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .requirement-section {
      padding: 16px 16px 14px;
      border: 1px solid #ece6fb;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.84);
    }

    .requirement-section-title {
      color: #2a2136;
      font: 650 16px/22px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .requirement-section-copy {
      margin-top: 8px;
      color: #6f667c;
      font: 400 14px/21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .requirement-list {
      margin: 10px 0 0;
      padding-left: 18px;
      color: #3a3145;
      font: 400 14px/21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    .requirement-list li + li {
      margin-top: 6px;
    }

    .requirement-empty {
      min-height: 100%;
      border: 1px dashed rgba(180, 169, 202, 0.72);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.44);
    }

    .phone {
      position: relative;
      flex: 0 0 auto;
      width: var(--screen-w);
      min-width: var(--screen-w);
      max-width: var(--screen-w);
      height: var(--screen-h);
      min-height: var(--screen-h);
      max-height: var(--screen-h);
      overflow: hidden;
      background: #fff;
      border-radius: 30px;
      box-shadow:
        0 22px 64px rgba(31, 28, 46, 0.16),
        0 8px 24px rgba(31, 28, 46, 0.1);
      transition: width 320ms cubic-bezier(0.22, 1, 0.36, 1), height 320ms cubic-bezier(0.22, 1, 0.36, 1);
      contain: layout paint;
    }

    .screen-stack,
    .screen-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .screen-layer {
      z-index: 1;
      transform: translate3d(0, 0, 0);
      opacity: 1;
      filter: none;
      will-change: transform, opacity, filter;
      transition:
        transform var(--motion-duration, 360ms) cubic-bezier(0.22, 1, 0.36, 1),
        opacity var(--motion-duration, 360ms) ease,
        filter var(--motion-duration, 360ms) ease;
    }

    .screen-image-fixed-top {
      clip-path: inset(0 0 calc(100% - var(--fixed-top-height, 408px)) 0);
    }

    .screen-scroll-region {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--scroll-region-top, 408px);
      bottom: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-y;
    }

    .screen-scroll-region::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .screen-scroll-canvas {
      position: relative;
      width: 100%;
    }

    .screen-scroll-content {
      position: relative;
      width: 100%;
      top: calc(-1 * var(--scroll-offset, 0px));
    }

    .screen-scroll-region .hotspot,
    .screen-scroll-region .scene-card,
    .screen-scroll-region .timer-control,
    .screen-scroll-region .night-light-switch,
    .screen-scroll-region .night-light-slider-control {
      touch-action: pan-y;
    }

    .screen-layer.no-motion {
      transition: none;
    }

    .screen-layer.from-right {
      transform: translate3d(100%, 0, 0);
      opacity: 0.98;
    }

    .screen-layer.from-left {
      transform: translate3d(-32%, 0, 0);
      opacity: 0.72;
      filter: brightness(0.96);
    }

    .screen-layer.from-right-soft {
      transform: translate3d(42%, 0, 0);
      opacity: 0.84;
    }

    .screen-layer.from-left-soft {
      transform: translate3d(-42%, 0, 0);
      opacity: 0.84;
    }

    .screen-layer.from-bottom {
      transform: translate3d(0, 100%, 0);
      opacity: 0.98;
      filter: drop-shadow(0 -18px 40px rgba(30, 20, 48, 0.16));
    }

    .screen-layer.fade-in {
      transform: scale(0.985);
      opacity: 0;
    }

    .screen-layer.to-left {
      transform: translate3d(-32%, 0, 0);
      opacity: 0.72;
      filter: brightness(0.96);
    }

    .screen-layer.to-right {
      transform: translate3d(100%, 0, 0);
      opacity: 0.92;
    }

    .screen-layer.to-left-soft {
      transform: translate3d(-42%, 0, 0);
      opacity: 0.78;
    }

    .screen-layer.to-right-soft {
      transform: translate3d(42%, 0, 0);
      opacity: 0.78;
    }

    .screen-layer.to-bottom {
      transform: translate3d(0, 100%, 0);
      opacity: 0.98;
      filter: drop-shadow(0 -18px 40px rgba(30, 20, 48, 0.14));
    }

    .screen-layer.fade-out {
      transform: scale(1.012);
      opacity: 0;
    }

    .screen-layer.dim-back {
      filter: brightness(0.88);
    }

    .screen-layer.content-fade-in,
    .screen-layer.content-fade-out {
      opacity: 0;
    }

    .screen-layer.clip-content {
      clip-path: inset(var(--clip-top, 408px) 0 0 0);
    }

    .screen-layer.clip-stable-top {
      clip-path: inset(0 0 calc(100% - var(--clip-top, 408px)) 0);
    }

    .screen-image {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspots {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .hotspot {
      position: absolute;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      touch-action: manipulation;
      border-radius: 16px;
    }

    .phone.is-transitioning .hotspot {
      pointer-events: none;
    }

    .phone.is-transitioning .motion-curve-grid,
    .phone.is-transitioning .motion-level-control,
    .phone.is-transitioning .scene-card,
    .phone.is-transitioning .night-light-switch,
    .phone.is-transitioning .night-light-slider-control,
    .phone.is-transitioning .monitoring-action-button {
      pointer-events: none;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(95, 49, 168, 0.08);
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .hotspot:active::after {
      opacity: 1;
      transform: scale(1);
    }

    .hotspot.is-power-toggle::after,
    .hotspot.is-power-toggle:active::after {
      opacity: 0;
      transform: none;
    }

    .hotspot.is-power-toggle:focus-visible {
      outline: none;
      background: transparent;
    }

    .hotspot:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
      background: rgba(95, 49, 168, 0.08);
    }

    .timer-control {
      position: absolute;
      z-index: 4;
      left: 28px;
      top: 467px;
      width: 100px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 11px;
      border: 0;
      border-radius: 999px;
      background: var(--timer-bg);
      color: var(--timer-color);
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 1px var(--timer-border);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    .timer-control.is-on {
      --timer-bg: #efeaff;
      --timer-border: #d8ccff;
      --timer-color: #562b96;
    }

    .timer-control.is-off {
      --timer-bg: #f5f4f6;
      --timer-border: #e6e1e8;
      --timer-color: #8a8290;
    }

    .timer-control::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(95, 49, 168, 0.1);
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .timer-control:active::after {
      opacity: 1;
      transform: scale(1);
    }

    .timer-control:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .power-hint {
      position: absolute;
      left: 315px;
      top: 446px;
      z-index: 4;
      width: 56px;
      height: 56px;
      pointer-events: none;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 220ms ease;
      transform-origin: 50% 50%;
    }

    .power-hint.is-visible {
      opacity: 1;
      animation: powerHintCirclePulse 1.5s ease-out 1;
    }

    .power-hint::before,
    .power-hint::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .power-hint::before {
      background: radial-gradient(circle, rgba(163, 122, 255, 0.18) 0%, rgba(163, 122, 255, 0.08) 48%, rgba(163, 122, 255, 0) 74%);
    }

    .power-hint::after {
      border: 2px solid rgba(141, 111, 247, 0.32);
      box-shadow: 0 0 0 0 rgba(141, 111, 247, 0.12);
    }

    @keyframes powerHintCirclePulse {
      0% {
        transform: scale(0.92);
        opacity: 0;
      }
      18% {
        opacity: 0.88;
      }
      58% {
        transform: scale(1.18);
        opacity: 0.56;
      }
      100% {
        transform: scale(1.28);
        opacity: 0;
      }
    }

    .timer-clock {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      box-sizing: border-box;
    }

    .timer-clock::before,
    .timer-clock::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1.5px;
      border-radius: 999px;
      background: currentColor;
      transform-origin: center bottom;
    }

    .timer-clock::before {
      height: 5px;
      transform: translate(-50%, -100%);
    }

    .timer-clock::after {
      height: 7px;
      transform: translate(-50%, -100%) rotate(58deg);
    }

    .timer-value {
      position: relative;
      z-index: 1;
      min-width: 45px;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }

    .timer-options {
      position: absolute;
      left: 16px;
      top: 648px;
      z-index: 4;
      width: 370px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 11px;
      isolation: isolate;
    }

    .timer-options::before {
      content: "";
      position: absolute;
      inset: -10px -8px;
      z-index: 0;
      border-radius: 28px;
      background: #fff;
    }

    .timer-option {
      position: relative;
      z-index: 1;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: #f4f4f5;
      color: #251227;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 1px rgba(30, 20, 48, 0.03), 0 1px 2px rgba(30, 20, 48, 0.04);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .timer-option:active {
      transform: scale(0.97);
    }

    .timer-option.is-selected {
      background: #5d2fa2;
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 6px 16px rgba(93, 47, 162, 0.18);
    }

    .timer-option:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .noise-loop-mask {
      position: absolute;
      left: 292px;
      top: 182px;
      z-index: 5;
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #fff;
      pointer-events: none;
    }

    .motion-controls {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .motion-curve-grid {
      position: absolute;
      left: 16px;
      top: 414px;
      width: 370px;
      display: grid;
      grid-template-columns: repeat(3, 120px);
      gap: 16px 5px;
      pointer-events: auto;
    }

    .motion-curve-button {
      width: 120px;
      height: 94px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 15px 16px 14px;
      border: 1px solid #ecebed;
      border-radius: 16px;
      background: #fff;
      color: #28121f;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .motion-curve-button:active {
      transform: scale(0.97);
    }

    .motion-curve-button.is-selected {
      border-color: #e3d8ff;
      background: #f4efff;
      color: #5d2fa2;
    }

    .motion-curve-button:focus-visible,
    .motion-level-control:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .motion-curve-wave {
      width: 47px;
      height: 32px;
      color: inherit;
    }

    .motion-level-control {
      position: absolute;
      left: 16px;
      top: 702px;
      width: 370px;
      height: 38px;
      display: grid;
      grid-template-columns: repeat(5, 74px);
      padding: 0;
      border: 0;
      border-radius: 48px;
      background: #f5f1fb;
      color: #28121f;
      pointer-events: auto;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .motion-level-thumb {
      position: absolute;
      left: var(--motion-level-left, 222px);
      top: 0;
      width: 74px;
      height: 38px;
      border-radius: 48px;
      background: #5d2fa2;
      box-shadow: 0 6px 14px rgba(93, 47, 162, 0.18);
      transition: left 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .motion-level-segment {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border: 0;
      padding: 0;
      border-radius: 48px;
      background: transparent;
      color: inherit;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      transition: color 160ms ease;
    }

    .motion-level-segment.is-selected {
      color: #fff;
    }

    .sleep-mode-dynamic {
      position: absolute;
      inset: 0;
      z-index: 4;
      color: #5d2fa2;
      pointer-events: none;
    }

    .sleep-mode-dynamic.is-off {
      color: #a98ed5;
    }

    .sleep-mode-tile-card {
      position: absolute;
      top: 540px;
      width: 165px;
      height: 91px;
      border: 1px solid #eee7ff;
      border-radius: 16px;
      background: linear-gradient(135deg, #f9f7ff 0%, #eee8ff 100%);
      color: currentColor;
      pointer-events: none;
    }

    .sleep-mode-dynamic.is-off .sleep-mode-tile-card {
      background: #fff;
    }

    .sleep-mode-tile-card.is-motion {
      left: 32px;
    }

    .sleep-mode-tile-card.is-noise {
      left: 205px;
    }

    .sleep-mode-tile-icon {
      position: absolute;
      left: 24px;
      top: 20px;
      width: 24px;
      height: 24px;
      color: currentColor;
    }

    .sleep-mode-tile-arrow {
      position: absolute;
      right: 19px;
      top: 20px;
      color: currentColor;
      font: 400 36px/24px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .sleep-mode-tile-value {
      position: absolute;
      left: 24px;
      right: 16px;
      bottom: 17px;
      overflow: hidden;
      color: currentColor;
      font: 500 15px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .scene-controls {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .scene-section-mask {
      position: absolute;
      left: 0;
      top: 648px;
      z-index: 1;
      width: 402px;
      height: 226px;
      background: #fff;
    }

    .scene-strip {
      position: absolute;
      left: 32px;
      top: 656px;
      z-index: 2;
      width: 338px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      pointer-events: auto;
    }

    .scene-card {
      min-width: 0;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border: 1px solid #eee7ff;
      border-radius: 16px;
      background: #fff;
      color: #3f3545;
      box-shadow: 0 1px 2px rgba(35, 26, 58, 0.03);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease, transform 120ms ease, box-shadow 180ms ease;
    }

    .scene-card:active {
      transform: scale(0.97);
    }

    .scene-card.is-selected {
      border-color: #ded2ff;
      background: #f4efff;
      color: #5d2fa2;
      box-shadow: 0 7px 16px rgba(93, 47, 162, 0.1);
    }

    .scene-card:focus-visible {

      top: 126px;

        top 520ms cubic-bezier(0.22, 1, 0.36, 1),
        width 520ms cubic-bezier(0.22, 1, 0.36, 1),
        height 520ms cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 520ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 260ms ease,
        transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .monitoring-snapshot-preview.is-minimized {
      left: 276px;
      top: 142px;
      width: 108px;
      height: 66px;
      border-radius: 12px;
      background-size: 402px auto;
      opacity: 1;
    }

    .monitoring-snapshot-preview.is-dismissed {
      opacity: 0;
      transform: translate3d(12px, -8px, 0) scale(0.82);
    }

    .hud {
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid rgba(86, 62, 116, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 34px rgba(31, 28, 46, 0.09);
      color: rgba(27, 21, 35, 0.68);
      font-size: 13px;
      line-height: 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .hud strong {
      color: #563098;
      font-weight: 650;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 5;
      max-width: calc(100% - 32px);
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(32, 21, 48, 0.88);
      color: #fff;
      font-size: 13px;
      line-height: 18px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
      white-space: nowrap;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 460px) {
      body {
        padding: 0;
        background: #fff;
      }

      .stage {
        grid-template-columns: 1fr;
        width: 100%;
        gap: 0;
        min-height: auto;
      }

      .workspace-sidebar,
      .requirement-panel {
        display: none;
      }

      .demo-panel {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .demo-panel-head {
        display: none;
      }

      .demo-panel-frame {
        padding: 0;
      }

      .phone-frame {
        width: 100%;
        gap: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .phone-frame::before,
      .phone-frame::after {
        display: none;
      }

      .phone {
        width: min(var(--screen-w), 100vw);
        height: calc(min(var(--screen-w), 100vw) * var(--screen-ratio));
        box-shadow: none;
        border-radius: 0;
      }

      .hud {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .phone,
      .screen-layer,
      .hotspot::after,
      .motion-curve-button,
      .motion-level-thumb,
      .night-light-title,
      .night-light-switch,
      .night-light-switch::after,
      .night-light-parameter-mask,
      .night-light-slider-control,
      .night-light-collapsed-mask,
      .night-light-collapsed-card,
      .power-hint,
      .power-hint::before,
      .power-hint::after,
      .monitoring-action-button::after,
      .monitoring-recording-badge,
      .monitoring-snapshot-preview,
      .toast {
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>

    function resetLayerState(layer) {
      layer.classList.remove(...transientLayerClasses);
      layer.style.zIndex = "";
      layer.style.removeProperty("--motion-duration");
      layer.style.removeProperty("--clip-top");
    }

    function createScreenImage(screen, options = {}) {
      const image = document.createElement("img");
      image.className = "screen-image";
      image.src = screen.image;
      image.alt = options.alt ?? screen.alt;
      if (options.fixedTopHeight) {
        image.classList.add("screen-image-fixed-top");
        image.style.setProperty("--fixed-top-height", `${options.fixedTopHeight}px`);
      }
      if (options.ariaHidden) {
        image.alt = "";
        image.setAttribute("aria-hidden", "true");
      }
      return image;
    }

    function appendHotspots(screen, parent, filterFn = () => true, heightRef = screen.height) {
      const hotspotLayer = document.createElement("div");
      hotspotLayer.className = "hotspots";
      let count = 0;

      for (const spot of screen.hotspots) {
        if (!filterFn(spot)) continue;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "hotspot";
        if (spot.label === "切换总开关" || spot.label === "打开总开关") {
          button.classList.add("is-power-toggle");
        }
        button.setAttribute("aria-label", spot.label);
        button.title = spot.label;
        button.style.left = `${(spot.x / screen.width) * 100}%`;
        button.style.top = `${(spot.y / heightRef) * 100}%`;
        button.style.width = `${(spot.w / screen.width) * 100}%`;
        button.style.height = `${(spot.h / heightRef) * 100}%`;
        button.addEventListener("click", spot.action);
        hotspotLayer.appendChild(button);
        count += 1;
      }

      if (count > 0) {
        parent.appendChild(hotspotLayer);
      }
    }

    function initializeScrollableRegion(layer, screen) {
      if (!screen.scrollable || !Number.isFinite(screen.stableTop)) return;
      const scrollRegion = layer.querySelector(".screen-scroll-region");
      if (!scrollRegion) return;
      scrollRegion.scrollTop = 0;
    }

    function showScreen(name, transitionName = "fade") {
      const screen = screens[name];
      if (!screen || transitionLocked) return;
      if (name === currentScreen && activeLayer) {
        renderHud(screen);
        return;
      }

      const transition = activeLayer ? transitions[transitionName] || transitions.fade : transitions.none;
      const previousScreen = screens[currentScreen];
      if (activeLayer && transition.contentOnly && previousScreen?.stableTop && screen.stableTop) {
        showContentTabScreen(name, screen, previousScreen, transition);
        return;
      }

      const previousLayer = activeLayer;
      const nextLayer = createLayer(screen);
      const hasMotion = transition.duration > 0;

      currentScreen = name;
      phone.style.setProperty("--screen-w", `${screen.width}px`);
      phone.style.setProperty("--screen-h", `${screen.height}px`);
      phone.style.setProperty("--screen-ratio", screen.height / screen.width);
      renderHud(screen);

      nextLayer.style.setProperty("--motion-duration", `${transition.duration}ms`);
      if (previousLayer) {
        previousLayer.style.setProperty("--motion-duration", `${transition.duration}ms`);
      }

      if (transition.nextFrom) {
        nextLayer.classList.add(transition.nextFrom);
      }

      if (!previousLayer || !hasMotion) {
        screenStack.replaceChildren(nextLayer);
        nextLayer.classList.remove("no-motion");
        activeLayer = nextLayer;
        initializeScrollableRegion(nextLayer, screen);
        updateTimerDisplays();
        updatePowerHint(activeLayer);
        return;
      }

      transitionLocked = true;
      phone.classList.add("is-transitioning");

      if (transition.placeNextBelow) {
        nextLayer.style.zIndex = "1";
        previousLayer.style.zIndex = "2";
        screenStack.insertBefore(nextLayer, previousLayer);
      } else {
        previousLayer.style.zIndex = "1";
        nextLayer.style.zIndex = "2";
        screenStack.appendChild(nextLayer);
      }

      nextLayer.getBoundingClientRect();
      requestAnimationFrame(() => {
        nextLayer.classList.remove(transition.nextFrom);
        if (transition.prevTo) {
          previousLayer.classList.add(transition.prevTo);
        }
      });

      window.setTimeout(() => {
        screenStack.replaceChildren(nextLayer);
        resetLayerState(nextLayer);
        activeLayer = nextLayer;
        transitionLocked = false;
        phone.classList.remove("is-transitioning");
        initializeScrollableRegion(nextLayer, screen);
        updateTimerDisplays();
        updatePowerHint(activeLayer);
      }, transition.duration + 40);
    }

    function showContentTabScreen(name, screen, previousScreen, transition) {
      const previousLayer = activeLayer;
      const nextLayer = createLayer(screen);
      const stableTopLayer = createLayer(previousScreen, { hotspots: false, overlays: false, scrollable: false });
      const clipTop = screen.stableTop || previousScreen.stableTop;

      currentScreen = name;
      phone.style.setProperty("--screen-w", `${screen.width}px`);
      phone.style.setProperty("--screen-h", `${screen.height}px`);
      phone.style.setProperty("--screen-ratio", screen.height / screen.width);
      renderHud(screen);

      transitionLocked = true;
      phone.classList.add("is-transitioning");

      for (const layer of [previousLayer, nextLayer, stableTopLayer]) {
        layer.style.setProperty("--motion-duration", `${transition.duration}ms`);
        layer.style.setProperty("--clip-top", `${clipTop}px`);
      }

      previousLayer.classList.add("clip-content");
      previousLayer.style.zIndex = "1";
      nextLayer.classList.add("clip-content", transition.nextFrom);
      nextLayer.style.zIndex = "2";
      stableTopLayer.classList.add("clip-stable-top");
      stableTopLayer.style.zIndex = "3";

      screenStack.appendChild(nextLayer);
      screenStack.appendChild(stableTopLayer);

      nextLayer.getBoundingClientRect();
      requestAnimationFrame(() => {
        nextLayer.classList.remove(transition.nextFrom);
        previousLayer.classList.add(transition.prevTo);
      });

      window.setTimeout(() => {
        resetLayerState(nextLayer);
        screenStack.replaceChildren(nextLayer);
        activeLayer = nextLayer;
        transitionLocked = false;
        phone.classList.remove("is-transitioning");
        initializeScrollableRegion(nextLayer, screen);
        updateTimerDisplays();
        updatePowerHint(activeLayer);
      }, transition.duration + 40);
    }

    function createLayer(screen, options = {}) {
      const withHotspots = options.hotspots !== false;
      const withOverlays = options.overlays !== false;
      const withScrollable = options.scrollable !== false && !!screen.scrollable && Number.isFinite(screen.stableTop);
      const layer = document.createElement("div");
      layer.className = "screen-layer";

      if (withScrollable) {
        if (screen.image) {
          layer.appendChild(createScreenImage(screen, { fixedTopHeight: screen.stableTop }));
        }

        if (withHotspots) {
          appendHotspots(screen, layer, (spot) => spot.y < screen.stableTop);
        }

        const scrollRegion = document.createElement("div");
        scrollRegion.className = "screen-scroll-region";
        scrollRegion.style.setProperty("--scroll-region-top", `${screen.stableTop}px`);

        const scrollCanvas = document.createElement("div");
        scrollCanvas.className = "screen-scroll-canvas";
        scrollCanvas.style.height = `${Math.max((screen.scrollHeight || screen.height) - screen.stableTop, screen.height - screen.stableTop)}px`;

        const scrollContent = document.createElement("div");
        scrollContent.className = "screen-scroll-content";
        scrollContent.style.setProperty("--scroll-offset", `${screen.stableTop}px`);
        scrollContent.style.height = `${Math.max(screen.scrollHeight || screen.height, screen.height)}px`;

        if (screen.image) {
          scrollContent.appendChild(createScreenImage(screen, { ariaHidden: true }));
        }

        if (withOverlays) {
          renderOverlays(screen, scrollContent);
        }

        if (withHotspots) {
          appendHotspots(screen, scrollContent, (spot) => spot.y >= screen.stableTop, screen.scrollHeight || screen.height);
        }

        scrollCanvas.appendChild(scrollContent);
        scrollRegion.appendChild(scrollCanvas);
        layer.appendChild(scrollRegion);
        return layer;
      }

      if (screen.image) {
        layer.appendChild(createScreenImage(screen));
      }

      if (withOverlays) {
        renderOverlays(screen, layer);
      }

      if (withHotspots) {
        appendHotspots(screen, layer);
      }
      return layer;
    }

    function takeMonitoringSnapshot() {
      const layer = activeLayer;
      if (!layer || currentScreen !== "monitoring") return;

      for (const preview of layer.querySelectorAll(".monitoring-snapshot-preview")) {
        preview.remove();
      }

      const preview = document.createElement("div");
      preview.className = "monitoring-snapshot-preview";
      layer.appendChild(preview);
      preview.getBoundingClientRect();

      requestAnimationFrame(() => {
        preview.classList.add("is-minimized");
      });

      window.setTimeout(() => {
        preview.classList.add("is-dismissed");
      }, 780);

      window.setTimeout(() => {
        preview.remove();
      }, 1120);
    }

    function updateMonitoringControls(root = document) {

    function createNightLightSlider(config) {
      const slider = document.createElement("div");
      slider.className = `night-light-slider-control${config.type === "temperature" ? " is-temperature" : ""}`;
      slider.tabIndex = 0;
      slider.dataset.type = config.type;
      slider.dataset.min = String(config.min);
      slider.dataset.max = String(config.max);
      slider.dataset.step = String(config.step);
      slider.style.setProperty("--night-light-slider-top", `${config.top}px`);
      slider.setAttribute("role", "slider");
      slider.setAttribute("aria-label", config.label);
      slider.setAttribute("aria-valuemin", String(config.min));
      slider.setAttribute("aria-valuemax", String(config.max));
      slider.innerHTML = `
        <span class="night-light-slider-label">${config.label}</span>
        <span class="night-light-slider-value"></span>
        <div class="night-light-slider-track"><div class="night-light-slider-fill"></div></div>
        <div class="night-light-slider-thumb"></div>
        <span class="night-light-slider-hint is-min">${config.minLabel}</span>
        <span class="night-light-slider-hint is-max">${config.maxLabel}</span>`;

      let isDragging = false;
      const setFromPointer = (event) => {
        const rect = slider.getBoundingClientRect();
        const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
        const rawValue = config.min + ratio * (config.max - config.min);
        config.setValue(roundToStep(rawValue, config.step));
      };

      slider.addEventListener("pointerdown", (event) => {
        if (!nightLightOn) return;
        isDragging = true;
        slider.setPointerCapture?.(event.pointerId);
        setFromPointer(event);
      });
      slider.addEventListener("pointermove", (event) => {
        if (isDragging) setFromPointer(event);
      });
      slider.addEventListener("pointerup", (event) => {
        isDragging = false;
        slider.releasePointerCapture?.(event.pointerId);
      });
      slider.addEventListener("pointercancel", () => {
        isDragging = false;
      });
      slider.addEventListener("keydown", (event) => {
        if (!nightLightOn) return;
        const currentValue = config.getValue();
        if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
          event.preventDefault();
          config.setValue(currentValue - config.step);
        }
        if (event.key === "ArrowRight" || event.key === "ArrowUp") {
          event.preventDefault();
          config.setValue(currentValue + config.step);
        }
      });

      return slider;
    }

    function getDefaultBabyAge(babyId) {
      return defaultBabyAgeById[babyId] || defaultBabyAgeById[babies[0].id] || 6;
    }

    function getBabyAgeForId(babyId) {
      if (typeof babyAgeById[babyId] === "number" && Number.isFinite(babyAgeById[babyId])) {
        return babyAgeById[babyId];
      }
      const baby = babies.find((item) => item.id === babyId);
      return getNumericAgeFromBirthday(baby?.birthday) ?? getDefaultBabyAge(babyId);
    }

    function getSelectedBaby() {
      return babies.find((baby) => baby.id === selectedBabyId) || babies[0];
    }

    function formatBirthday(value) {
      if (!value) return "未填写";
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return value;
      return `${match[1]}.${match[2]}.${match[3]}`;
    }

    function parseDateOnly(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return null;
      return new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])));
    }

    function getDaysBetween(start, end) {
      const msPerDay = 24 * 60 * 60 * 1000;
      return Math.max(0, Math.floor((end - start) / msPerDay));
    }

    function getWholeMonthsAndRemainder(startDate, endDate) {
      let months = (endDate.getUTCFullYear() - startDate.getUTCFullYear()) * 12 + (endDate.getUTCMonth() - startDate.getUTCMonth());
      let anchor = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth() + months, startDate.getUTCDate()));
      if (anchor > endDate) {
        months -= 1;
        anchor = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth() + months, startDate.getUTCDate()));
      }
      return { months: Math.max(0, months), days: getDaysBetween(anchor, endDate) };
    }

    function getAgeDisplayFromBirthday(birthday) {
      const birthDate = parseDateOnly(birthday);
      if (!birthDate) return "未填写";
      const totalDays = getDaysBetween(birthDate, AGE_REFERENCE_DATE);
      if (totalDays <= 28) return "Newborn";
      const { months, days } = getWholeMonthsAndRemainder(birthDate, AGE_REFERENCE_DATE);
      if (months <= 0) return "1 Month";
      if (days === 0) return `${months} Months`;
      if (days < 15) return `${months} - ${months + 0.5} Months`;
      return `${months + 0.5} - ${months + 1} Months`;
    }

    function getNumericAgeFromBirthday(birthday) {
      const birthDate = parseDateOnly(birthday);
      if (!birthDate) return null;
      const totalDays = getDaysBetween(birthDate, AGE_REFERENCE_DATE);
      if (totalDays <= 28) return 0;
      const { months, days } = getWholeMonthsAndRemainder(birthDate, AGE_REFERENCE_DATE);
      if (months <= 0) return 1;
      return months + (days >= 15 ? 1 : 0);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getBabyChoiceMarkup() {
      return babies.map((baby) => `
        <button type="button" class="onboarding-choice-card" data-baby-id="${baby.id}">
          <div class="onboarding-baby-avatar">${escapeHtml(baby.avatar)}</div>
          <div class="onboarding-choice-body">
            <div class="onboarding-choice-top">
              <div class="onboarding-baby-name">${escapeHtml(baby.name)}</div>
            </div>
          </div>
          <div class="onboarding-choice-check">✓</div>
        </button>`).join("");
    }

    function createBabyIdFromName(name) {
      const normalized = (name || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
      const base = normalized || `baby-${Date.now()}`;
      let nextId = base;
      let suffix = 2;
      while (babies.some((baby) => baby.id === nextId)) {
        nextId = `${base}-${suffix}`;
        suffix += 1;
      }
      return nextId;
    }

    function getBabyAvatar(name) {
      const firstChar = String(name || "").trim().charAt(0);
      return firstChar ? firstChar.toUpperCase() : "B";
    }

    function rebuildOnboardingBabyChoices(root = activeLayer || document) {
      const list = root.querySelector(".onboarding-choice-list");
      if (!list) return;
      list.innerHTML = getBabyChoiceMarkup();
      for (const button of list.querySelectorAll(".onboarding-choice-card")) {
        button.addEventListener("click", () => selectBabyProfile(button.dataset.babyId || babies[0].id));
      }
      updateOnboardingDisplays(root);
    }

    function getRecommendedProfile() {
      return ageRecommendations.find((item) => selectedBabyAgeMonths >= item.min && selectedBabyAgeMonths <= item.max) || ageRecommendations[1];
    }

    function enterCribFlow() {
      if (!babies.some((baby) => baby.id === selectedBabyId)) {
        selectedBabyId = babies[0].id;
      }
      selectedBabyAgeMonths = getBabyAgeForId(selectedBabyId);
      onboardingStep = 1;
      babyEditorVisible = false;
      showScreen("onboarding", "push");
    }

    function selectBabyProfile(babyId) {
      if (!babies.some((baby) => baby.id === babyId)) return;
      selectedBabyId = babyId;
      selectedBabyAgeMonths = getBabyAgeForId(babyId);
      updateOnboardingDisplays();
      persistPrototypeState();
    }

    function updateSelectedBabyBirthday(birthday) {
      const safeBirthday = String(birthday || "").trim();
      if (!safeBirthday) return;
      const baby = babies.find((item) => item.id === selectedBabyId);
      if (!baby) return;
      baby.birthday = safeBirthday;
      const derivedAge = getNumericAgeFromBirthday(safeBirthday);
      if (derivedAge !== null) {
        selectedBabyAgeMonths = clamp(derivedAge, 0, 24);
        babyAgeById[selectedBabyId] = selectedBabyAgeMonths;
      }
      updateOnboardingDisplays();
      persistPrototypeState();
    }

    function setBabyAge(months) {
      selectedBabyAgeMonths = months;
      babyAgeById[selectedBabyId] = months;
      updateOnboardingDisplays();
      const root = activeLayer || document;
      const ageSheet = root.querySelector(".age-sheet-options");
      if (ageSheet) {
        ageSheet.style.display = "none";
      }
      persistPrototypeState();
      toast(`已更新为 ${months} 个月`);
    }

    function toggleBabyEditor(force) {
      const root = activeLayer || document;
      const editor = root.querySelector("#babyEditorScreen");
      if (!editor) return;
      const nextVisible = typeof force === "boolean" ? force : !babyEditorVisible;
      babyEditorVisible = nextVisible;
      editor.style.display = nextVisible ? "flex" : "none";
      if (nextVisible) {
        const firstNameInput = root.querySelector("#babySheetFirstNameInput");
        const lastNameInput = root.querySelector("#babySheetLastNameInput");
        if (firstNameInput) firstNameInput.value = "";
        if (lastNameInput) lastNameInput.value = "";
        updateBabyEditorForm(root);
        root.querySelector("#babySheetFirstNameInput")?.focus();
      }
    }

    function updateBabyEditorForm(root = activeLayer || document) {
      const nameInput = root.querySelector("#babySheetNameInput");
      const birthdayInput = root.querySelector("#babySheetBirthdayInput");
      const birthdayDisplay = root.querySelector("#babySheetBirthdayDisplay");
      const birthdayDisplayWrap = root.querySelector("#babySheetBirthdayDisplayWrap");
      const confirm = root.querySelector("#babySheetConfirmButton");
      const safeName = String(pendingBabyName || "").trim();
      if (nameInput && nameInput.value !== pendingBabyName) nameInput.value = pendingBabyName;
      if (birthdayInput && birthdayInput.value !== pendingBabyBirthday) birthdayInput.value = pendingBabyBirthday;
      if (birthdayDisplay) {
        birthdayDisplay.textContent = pendingBabyBirthday ? formatBirthday(pendingBabyBirthday) : "Child's Birthday";
      }
      if (birthdayDisplayWrap) {
        birthdayDisplayWrap.classList.toggle("is-filled", Boolean(pendingBabyBirthday));
      }
      if (confirm) confirm.disabled = !(safeName && pendingBabyBirthday);
    }

    function toggleAgeSheet(force) {
      const root = activeLayer || document;
      const ageSheet = root.querySelector(".age-sheet-options");
      if (!ageSheet) return;
      const nextVisible = typeof force === "boolean" ? force : ageSheet.style.display === "none";
      ageSheet.style.display = nextVisible ? "grid" : "none";
    }

    function addBabyProfile(name, birthday, months) {
      const trimmedName = String(name || "").trim();
      const safeBirthday = String(birthday || "").trim();
      const derivedMonths = typeof months === "number" && Number.isFinite(months)
        ? months
        : getNumericAgeFromBirthday(safeBirthday);
      const safeMonths = clamp(Math.round(derivedMonths ?? 3), 0, 24);
      if (!trimmedName || !safeBirthday) return false;
      const nextId = createBabyIdFromName(trimmedName);
      babies.push({
        id: nextId,
        name: trimmedName,
        birthday: safeBirthday,
        avatar: getBabyAvatar(trimmedName)
      });
      babyAgeById[nextId] = safeMonths;
      selectedBabyId = nextId;
      selectedBabyAgeMonths = safeMonths;
      pendingBabyName = "";
      pendingBabyBirthday = "";
      pendingBabyAge = 3;
      babyEditorVisible = false;
      rebuildOnboardingBabyChoices();
      persistPrototypeState();
      return true;
    }

    function goToOnboardingStep(step) {
      onboardingStep = clamp(Math.round(step), 1, 3);
      toggleAgeSheet(false);
      updateOnboardingDisplays();
    }

    function applySceneToGeneral(sceneId, { setActive = true } = {}) {
      const source = scenes.find((scene) => scene.id === sceneId);
      const general = scenes.find((scene) => scene.id === "general");
      if (!source || !general) return;
      general.mode = source.mode;
      general.curve = source.curve;
      general.movementPath = source.movementPath;
      general.motionLevel = source.motionLevel;
      general.realtimeMonitoring = source.realtimeMonitoring;
      general.track = source.track;
      general.volume = source.volume;
      general.loopMode = source.loopMode;
      general.meta = `${source.movementPath.replace("Curve ", "C")} · ${source.track.replace("Ocean Waves", "Ocean").replace("Moon Lullaby", "Lullaby").replace("Cotton Cloud", "Cloud")}`;
      if (setActive) {
        selectScene("general");
      } else {
        updateSceneControls();
        updateSleepModeDynamic();
      }
    }

    function applyRecommendedOnboarding() {
      const recommendation = getRecommendedProfile();
      applySceneToGeneral(recommendation.sceneId, { setActive: true });
      completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
      cribOnboardingCompleted = true;
      persistPrototypeState();
      showScreen(powerOn ? "soothing" : "soothingOff", "push");
    }

      const scene = scenes.find((item) => item.id === recommendation.sceneId) || scenes[0];
      const stepMeta = {
        1: {

          title: "欢迎使用智能婴儿床，请确认要守护的宝宝",
          copy: "我们将按照宝宝当前的月龄，推荐更合适的哄睡服务方案。"
        },
        2: {
          progress: "步骤 2 / 3",
          title: `确认 ${baby.name} 的月龄`,
          copy: "我们会按以下信息，给宝宝推荐符合当前阶段的哄睡方案配置。"
        },
        3: {
          progress: "步骤 3 / 3",
          title: `根据当前月龄的睡眠特点，生成${baby.name}的哄睡配置方案。`,
          copy: "我们会将以下配置信息写入“推荐”卡。后续在使用过程中，您可随时修改。"
        }
      };
      const currentStep = stepMeta[onboardingStep] || stepMeta[1];

      for (const value of root.querySelectorAll("#onboardingProgressLabel")) {
        value.textContent = currentStep.progress;
      }
      for (const value of root.querySelectorAll("#onboardingProgressFill")) {
        value.style.width = `${(onboardingStep / 3) * 100}%`;
      }
      for (const value of root.querySelectorAll("#onboardingTitle")) {
        value.textContent = currentStep.title;
      }
      for (const value of root.querySelectorAll("#onboardingCopy")) {
        value.textContent = currentStep.copy;
      }
      for (const step of root.querySelectorAll(".onboarding-step")) {
        step.classList.toggle("is-active", Number(step.dataset.step) === onboardingStep);
      }
      for (const card of root.querySelectorAll(".onboarding-choice-card")) {
        const babyId = card.dataset.babyId;
        const isSelected = babyId === selectedBabyId;
        card.classList.toggle("is-selected", isSelected);
        card.setAttribute("aria-pressed", String(isSelected));
      }
      for (const value of root.querySelectorAll("[data-baby-age]")) {
        const babyId = value.getAttribute("data-baby-age");
        if (babyId) {
          const targetBaby = babies.find((item) => item.id === babyId);
          value.textContent = getAgeDisplayFromBirthday(targetBaby?.birthday);
        }
      }
      for (const value of root.querySelectorAll("#onboardingBabyAvatar")) {
        value.textContent = baby.avatar;
      }
      for (const value of root.querySelectorAll("#onboardingBabyName")) {
        value.textContent = baby.name;
      }
      for (const value of root.querySelectorAll("#onboardingBabyAgePill")) {
        value.textContent = getAgeDisplayFromBirthday(baby.birthday);
      }
      for (const value of root.querySelectorAll("#onboardingSummaryBirthday")) {
        value.textContent = formatBirthday(baby.birthday);
      }
      for (const value of root.querySelectorAll("#onboardingBirthdayInput")) {
        value.value = baby.birthday || "";
      }
      for (const value of root.querySelectorAll("#onboardingAgeValue")) {
        value.textContent = String(selectedBabyAgeMonths);
      }
      for (const value of root.querySelectorAll("#onboardingSceneCurve")) {
        value.textContent = scene.movementPath;
      }
      for (const value of root.querySelectorAll("#onboardingSceneLevel")) {
        value.textContent = String(scene.motionLevel);
      }
      for (const value of root.querySelectorAll("#onboardingSceneTrack")) {
        value.textContent = scene.track;
      }
      for (const value of root.querySelectorAll("#onboardingSceneVolume")) {
        value.textContent = `${scene.volume}%`;
      }
      for (const sheet of root.querySelectorAll(".age-sheet-options")) {
        if (!sheet.style.display) {
          sheet.style.display = "none";
        }
      }

      if (editor && !editor.style.display) {
        editor.style.display = babyEditorVisible ? "flex" : "none";
      }
      for (const option of root.querySelectorAll(".age-sheet-option")) {
        option.classList.toggle("is-selected", Number(option.dataset.months) === selectedBabyAgeMonths);

            goToOnboardingStep(onboardingStep - 1);

          openWorkspacePanel("devices");

      if (addBabyButton) addBabyButton.addEventListener("click", () => {
        if (ageSheet) ageSheet.style.display = "none";
        pendingBabyName = "";
        pendingBabyBirthday = "";
        pendingBabyAge = 3;
        toggleBabyEditor(true);
      });
      if (step1NextButton) step1NextButton.addEventListener("click", () => goToOnboardingStep(2));
      if (skipButton) skipButton.addEventListener("click", () => {
        completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
        cribOnboardingCompleted = true;
        persistPrototypeState();
        openWorkspacePanel("detail");
      });
      if (ageSkipButton) ageSkipButton.addEventListener("click", () => {
        completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
        cribOnboardingCompleted = true;
        persistPrototypeState();
        openWorkspacePanel("detail");
      });
      if (step3SkipButton) step3SkipButton.addEventListener("click", () => {
        completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
        cribOnboardingCompleted = true;
        persistPrototypeState();
        openWorkspacePanel("detail");

      if (babyEditorBackButton) babyEditorBackButton.addEventListener("click", () => toggleBabyEditor(false));
      if (babyCancelButton) babyCancelButton.addEventListener("click", () => toggleBabyEditor(false));

      if (ageGrid) {
        for (const months of [1, 2, 3, 4, 5, 6, 9, 12]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "age-sheet-option";
          button.dataset.months = String(months);
          button.textContent = String(months);
          button.addEventListener("click", () => setBabyAge(months));
          ageGrid.appendChild(button);
        }
      }

      if (babyAgeGrid) {
        for (const months of [1, 2, 3, 4, 5, 6, 9, 12]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "age-sheet-option";
          button.dataset.months = String(months);
          button.textContent = String(months);
          button.addEventListener("click", () => {
            pendingBabyAge = months;
            updateBabyEditorForm(layer);
          });
          babyAgeGrid.appendChild(button);
        }
      }

      if (babyNameInput) {
        babyNameInput.addEventListener("input", () => {
          pendingBabyName = babyNameInput.value;
          updateBabyEditorForm(layer);
        });
      }

      if (babyBirthdayInput) {
        babyBirthdayInput.addEventListener("input", () => {
          pendingBabyBirthday = babyBirthdayInput.value;
          const derivedAge = getNumericAgeFromBirthday(pendingBabyBirthday);
          if (derivedAge !== null) {
            pendingBabyAge = clamp(derivedAge, 0, 24);
          }
          updateBabyEditorForm(layer);
        });
      }

      if (babyConfirmButton) {
        babyConfirmButton.addEventListener("click", () => {
          if (!addBabyProfile(pendingBabyName, pendingBabyBirthday, pendingBabyAge)) return;
          toggleBabyEditor(false);
          toast(`已添加 ${getSelectedBaby().name}`);
        });
      }

      if (ageSheet && !ageSheet.style.display) {
        ageSheet.style.display = "none";
      }

      updateOnboardingDisplays(layer);
    }

    function persistPrototypeState() {
      try {
        localStorage.setItem("cribPrototypeState", JSON.stringify({
          powerOn,
          selectedDurationMinutes,
          remainingSeconds,
          selectedCurve,
          motionLevel,
          realtimeMonitoring,
          activeTrack,
          noiseVolume,
          loopMode,
          selectedSceneId,
          nightLightOn,
          nightLightBrightness,
          nightLightTemperature,
          cribOnboardingCompleted,
          completedOnboardingVersion,
          selectedBabyId,
          selectedBabyAgeMonths,
          powerHintShown,
          babies,
          babyAgeById,
          pendingBabyBirthday,
          babyEditorVisible,
          scenes
        }));
      } catch {}
    }

    function loadPrototypeState() {
      try {
        const saved = JSON.parse(localStorage.getItem("cribPrototypeState") || "null");
        if (!saved || typeof saved !== "object") return;
        if (typeof saved.powerOn === "boolean") powerOn = saved.powerOn;
        if (typeof saved.selectedDurationMinutes === "number") selectedDurationMinutes = saved.selectedDurationMinutes;
        if (typeof saved.remainingSeconds === "number") remainingSeconds = saved.remainingSeconds;
        if (typeof saved.selectedCurve === "number") selectedCurve = saved.selectedCurve;
        if (typeof saved.motionLevel === "number") motionLevel = saved.motionLevel;
        if (typeof saved.realtimeMonitoring === "boolean") realtimeMonitoring = saved.realtimeMonitoring;
        if (typeof saved.activeTrack === "string") activeTrack = saved.activeTrack;
        if (typeof saved.noiseVolume === "number") noiseVolume = saved.noiseVolume;
        if (typeof saved.loopMode === "string") loopMode = saved.loopMode;
        if (typeof saved.selectedSceneId === "string") selectedSceneId = saved.selectedSceneId;
        if (typeof saved.nightLightOn === "boolean") nightLightOn = saved.nightLightOn;
        if (typeof saved.nightLightBrightness === "number") nightLightBrightness = saved.nightLightBrightness;
        if (typeof saved.nightLightTemperature === "number") nightLightTemperature = saved.nightLightTemperature;
        if (typeof saved.powerHintShown === "boolean") powerHintShown = saved.powerHintShown;
        if (Array.isArray(saved.babies)) {
          babies.length = 0;
          for (const persistedBaby of saved.babies) {
            if (!persistedBaby || typeof persistedBaby !== "object") continue;
            if (typeof persistedBaby.id !== "string" || typeof persistedBaby.name !== "string") continue;
            babies.push({
              id: persistedBaby.id,
              name: persistedBaby.name,
              birthday: typeof persistedBaby.birthday === "string"
                ? persistedBaby.birthday
                : "",
              avatar: typeof persistedBaby.avatar === "string" ? persistedBaby.avatar : getBabyAvatar(persistedBaby.name)
            });
          }
        }
        if (saved.babyAgeById && typeof saved.babyAgeById === "object") {
          for (const baby of babies) {
            if (typeof saved.babyAgeById[baby.id] === "number") {
              babyAgeById[baby.id] = saved.babyAgeById[baby.id];
            }
          }
        }
        if (typeof saved.completedOnboardingVersion === "number") completedOnboardingVersion = saved.completedOnboardingVersion;
        if (typeof saved.selectedBabyId === "string" && babies.some((baby) => baby.id === saved.selectedBabyId)) {
          selectedBabyId = saved.selectedBabyId;
        }
        if (!saved.babyAgeById && typeof saved.selectedBabyAgeMonths === "number") {
          babyAgeById[selectedBabyId] = saved.selectedBabyAgeMonths;
        }
        if (typeof saved.pendingBabyBirthday === "string") pendingBabyBirthday = saved.pendingBabyBirthday;
        if (typeof saved.babyEditorVisible === "boolean") babyEditorVisible = saved.babyEditorVisible;
        selectedBabyAgeMonths = getBabyAgeForId(selectedBabyId);
        if (typeof saved.cribOnboardingCompleted === "boolean") {
          cribOnboardingCompleted = saved.cribOnboardingCompleted && completedOnboardingVersion >= ONBOARDING_FLOW_VERSION;
        }
        if (Array.isArray(saved.scenes)) {
          for (const persisted of saved.scenes) {
            const localScene = scenes.find((scene) => scene.id === persisted.id);
            if (!localScene) continue;
            Object.assign(localScene, persisted);
          }
        }
        const sceneTitleOverrides = {
          general: "推荐",
          night: "自定义1",
          nap: "自定义2"
        };
        for (const scene of scenes) {
          if (sceneTitleOverrides[scene.id]) {
            scene.title = sceneTitleOverrides[scene.id];
          }
          scene.loopMode = "single";
        }
        loopMode = "single";
      } catch {}
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function roundToStep(value, step) {
      return Math.round(value / step) * step;
    }

    function setMotionLevel(level) {
      motionLevel = clamp(level, 0, 4);
      getActiveScene().motionLevel = motionLevel;
      updateMotionControlDisplays();
      updateSleepModeDynamic();
      persistPrototypeState();
    }

    function getActiveScene() {
      return scenes.find((scene) => scene.id === selectedSceneId) || scenes[0];
    }

    function selectScene(sceneId) {
      const scene = scenes.find((item) => item.id === sceneId);
      if (!scene) return;
      selectedSceneId = scene.id;
      selectedCurve = scene.curve;
      motionLevel = scene.motionLevel;
      realtimeMonitoring = scene.realtimeMonitoring;
      activeTrack = scene.track;
      noiseVolume = scene.volume;
      loopMode = scene.loopMode;
      noisePlaying = true;
      updateSceneControls();
      updateSleepModeDynamic();
      updateMotionControlDisplays();
      renderHud(screens[currentScreen]);
      persistPrototypeState();
    }

    function setNightLightBrightness(value) {
      nightLightBrightness = clamp(Math.round(value), 0, 100);
      updateNightLightControls();
      persistPrototypeState();
    }

    function setNightLightTemperature(value) {
      nightLightTemperature = clamp(roundToStep(value, 100), 2700, 5500);
      updateNightLightControls();
      persistPrototypeState();
    }

    function setNightLightPower(nextPower) {
      if (nightLightOn === nextPower) return;
      nightLightOn = nextPower;
      updateNightLightControls();
      persistPrototypeState();
    }

    function updateMotionControlDisplays(root = document) {
      for (const button of root.querySelectorAll(".motion-curve-button")) {
        const isSelected = Number(button.dataset.curve) === selectedCurve;
        button.classList.toggle("is-selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      }

      for (const control of root.querySelectorAll(".motion-level-control")) {
        control.style.setProperty("--motion-level-left", `${motionLevel * 74}px`);
        control.setAttribute("aria-valuenow", String(motionLevel));
        control.setAttribute("aria-valuetext", motionLevel === 0 ? "Off" : `Level ${motionLevel}`);
        for (const segment of control.querySelectorAll(".motion-level-segment")) {
          segment.classList.toggle("is-selected", Number(segment.dataset.level) === motionLevel);
        }
      }
    }

    function updateSceneControls(root = document) {
      for (const button of root.querySelectorAll(".scene-card")) {
        const scene = scenes.find((item) => item.id === button.dataset.sceneId);
        const isSelected = button.dataset.sceneId === selectedSceneId;
        button.classList.toggle("is-selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
        if (scene) {
          const title = button.querySelector(".scene-card-title");
          if (title) {
            title.textContent = scene.title;
          }
        }
      }
    }

    function updateSleepModeDynamic(root = document) {
      const scene = getActiveScene();
      for (const dynamic of root.querySelectorAll(".sleep-mode-dynamic")) {
        dynamic.classList.toggle("is-on", powerOn);
        dynamic.classList.toggle("is-off", !powerOn);
      }

      for (const value of root.querySelectorAll(".sleep-mode-tile-card.is-motion .sleep-mode-tile-value")) {
        value.textContent = scene.movementPath;
      }

      for (const value of root.querySelectorAll(".sleep-mode-tile-card.is-noise .sleep-mode-tile-value")) {
        value.textContent = activeTrack;
      }
    }

    function updatePowerHint(root = document) {
      const shouldShow = cribOnboardingCompleted && !powerOn && !powerHintShown && (currentScreen === "soothing" || currentScreen === "soothingOff");
      const hints = root.matches?.(".power-hint")
        ? [root, ...root.querySelectorAll(".power-hint")]
        : [...root.querySelectorAll(".power-hint")];
      for (const hint of hints) {
        hint.classList.toggle("is-visible", shouldShow);
      }
      window.clearTimeout(powerHintTimer);
      if (shouldShow) {
        powerHintShown = true;
        persistPrototypeState();
        powerHintTimer = window.setTimeout(() => {
          for (const hint of document.querySelectorAll(".power-hint")) {
            hint.classList.remove("is-visible");
          }
        }, 1600);
      }
    }

    function updateNightLightControls(root = document) {
      const controlRoots = root.matches?.(".night-light-controls")
        ? [root, ...root.querySelectorAll(".night-light-controls")]
        : [...root.querySelectorAll(".night-light-controls")];

      for (const controls of controlRoots) {
        controls.classList.toggle("is-off", !nightLightOn);
      }

      for (const value of root.querySelectorAll(".night-light-title-value")) {
        value.textContent = `${nightLightBrightness}%`;
      }

      for (const button of root.querySelectorAll(".night-light-switch")) {
        button.classList.toggle("is-off", !nightLightOn);
        button.setAttribute("aria-pressed", String(nightLightOn));
      }

      for (const slider of root.querySelectorAll(".night-light-slider-control")) {
        const isTemperature = slider.dataset.type === "temperature";
        const min = Number(slider.dataset.min);
        const max = Number(slider.dataset.max);
        const value = isTemperature ? nightLightTemperature : nightLightBrightness;
        const displayValue = isTemperature ? `${value}K` : `${value}%`;
        const ratio = clamp((value - min) / (max - min), 0, 1);
        const trackWidth = 338;
        const fillWidth = ratio * trackWidth;
        slider.style.setProperty("--night-light-fill-width", `${fillWidth}px`);
        slider.style.setProperty("--night-light-thumb-left", `${fillWidth - 14}px`);
        slider.setAttribute("aria-valuenow", String(value));
        slider.setAttribute("aria-valuetext", displayValue);
        const valueLabel = slider.querySelector(".night-light-slider-value");
        if (valueLabel) {
          valueLabel.textContent = displayValue;
        }
      }
    }

    function renderRequirementPanel(panel = activeWorkspacePanel) {
      const content = requirementContent[panel] || requirementContent.devices;
      requirementTitleEl.textContent = content.title;
      requirementCopyEl.textContent = content.copy;

      if (!content.sections.length) {
        requirementBodyEl.innerHTML = "";
        return;
      }

      requirementBodyEl.innerHTML = content.sections.map((section) => {
        const items = Array.isArray(section.items) && section.items.length
          ? `<ul class="requirement-list">${section.items.map((item) => `<li>${item}</li>`).join("")}</ul>`
          : "";
        const copy = section.copy ? `<div class="requirement-section-copy">${section.copy}</div>` : "";
        return `<section class="requirement-section"><div class="requirement-section-title">${section.title}</div>${copy}${items}</section>`;
      }).join("");
    }

    function updateWorkspaceNav(panel = activeWorkspacePanel) {
      for (const button of workspaceNav.querySelectorAll(".workspace-nav-button")) {
        const isActive = button.dataset.panelTarget === panel;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      }
    }

    function openWorkspacePanel(panel) {
      activeWorkspacePanel = panel;
      updateWorkspaceNav(panel);
      renderRequirementPanel(panel);

      if (panel === "devices") {
        showScreen("devices", "fade");
        return;
      }

      if (panel === "onboarding") {
        if (!babies.some((baby) => baby.id === selectedBabyId)) {
          selectedBabyId = babies[0].id;
        }
        selectedBabyAgeMonths = getBabyAgeForId(selectedBabyId);
        onboardingStep = 1;
        showScreen("onboarding", "push");
        return;
      }

      if (panel === "detail") {
        showScreen(powerOn ? "soothing" : "soothingOff", "push");
      }
    }

    function renderHud(screen) {
      const mode = powerOn ? "On" : "Off";
      hud.innerHTML = `<strong>${screen.label}</strong><span>Power ${mode}</span><span>Noise ${noisePlaying ? "Playing" : "Paused"}</span>`;
    }

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("is-visible");
      }, 1200);
      renderHud(screens[currentScreen]);
    }

    function formatCountdown(seconds) {
      const safeSeconds = Math.max(0, seconds);
      const minutes = Math.floor(safeSeconds / 60);
      const remainder = safeSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
    }

    function getCountdownDisplaySeconds() {
      return powerOn ? remainingSeconds : selectedDurationMinutes * 60;
    }

    function updateTimerDisplays() {
      for (const button of document.querySelectorAll(".timer-control")) {
        button.classList.toggle("is-on", powerOn);
        button.classList.toggle("is-off", !powerOn);
      }
      for (const value of document.querySelectorAll(".timer-value")) {
        value.textContent = formatCountdown(getCountdownDisplaySeconds());
      }
      updateTimerOptionButtons();
    }

    function updateTimerOptionButtons(root = document) {
      for (const button of root.querySelectorAll(".timer-option")) {
        button.classList.toggle("is-selected", Number(button.dataset.minutes) === pendingDurationMinutes);
      }
    }

    function stopCountdown() {
      window.clearInterval(countdownInterval);
      countdownInterval = null;
    }

    function startCountdown() {
      stopCountdown();
      if (!powerOn) return;
      countdownInterval = window.setInterval(() => {
        if (!powerOn) {
          stopCountdown();
          return;
        }
        if (remainingSeconds > 0) {
          remainingSeconds -= 1;
          updateTimerDisplays();
        } else {
          stopCountdown();
        }
      }, 1000);
    }

    function resetCountdown(minutes) {
      remainingSeconds = minutes * 60;
      updateTimerDisplays();
      startCountdown();
      persistPrototypeState();
    }

    loadPrototypeState();
    for (const button of workspaceNav.querySelectorAll(".workspace-nav-button")) {
      button.addEventListener("click", () => {
        openWorkspacePanel(button.dataset.panelTarget || "devices");
      });
    }
    updateWorkspaceNav(activeWorkspacePanel);
    renderRequirementPanel(activeWorkspacePanel);
    showScreen(currentScreen, "none");
    updateTimerDisplays();
  </script>
</body>
</html>
