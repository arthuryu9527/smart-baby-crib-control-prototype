        const editableScene = mode === "edit" ? getSceneById(options.sceneId || selectedSceneId) : null;
        sceneEditorMode = editableScene && isCustomScene(editableScene) ? "edit" : "create";
        editingSceneId = sceneEditorMode === "edit" ? editableScene.id : null;
        const sourceScene = sceneEditorMode === "edit" ? editableScene : null;
        pendingSceneName = sourceScene?.title || "自定义方案";
        pendingSceneCurve = sourceScene?.curve ?? 2;
        pendingSceneMotionLevel = sourceScene?.motionLevel ?? 2;
        pendingSceneMonitoring = sourceScene?.realtimeMonitoring ?? true;
        pendingSceneTrack = sourceScene?.track || "Moon Lullaby";
        pendingSceneVolume = sourceScene?.volume ?? 28;
        persistPrototypeState();
        showScreen("sceneEditor", "sheet-open");
        return;
      }
      sceneEditorMode = "create";
      editingSceneId = null;
      persistPrototypeState();
      showScreen(sceneEditorReturnScreen || (powerOn ? "soothing" : "soothingOff"), "sheet-close");
    }

    function setupSceneEditor(editor) {
      const backButton = editor.querySelector("#sceneEditorBackButton");
      const saveButton = editor.querySelector("#sceneEditorSaveButton");
      const deleteButton = editor.querySelector("#sceneEditorDeleteButton");
      const deleteConfirm = editor.querySelector("#sceneDeleteConfirm");
      const deleteConfirmCancel = editor.querySelector("#sceneDeleteConfirmCancel");
      const deleteConfirmSubmit = editor.querySelector("#sceneDeleteConfirmSubmit");
      const nameInput = editor.querySelector("#sceneEditorNameInput");
      const curveGroup = editor.querySelector("#sceneEditorCurveGroup");
      const levelGroup = editor.querySelector("#sceneEditorLevelGroup");
      const monitoringSwitch = editor.querySelector("#sceneEditorMonitoringSwitch");
      const trackGroup = editor.querySelector("#sceneEditorTrackGroup");
      const volumeGroup = editor.querySelector("#sceneEditorVolumeGroup");

      const toggleDeleteConfirm = (visible) => {
        if (!deleteConfirm) return;
        deleteConfirm.classList.toggle("is-visible", visible);
        deleteConfirm.setAttribute("aria-hidden", String(!visible));
      };

      if (curveGroup && !curveGroup.children.length) {
        for (const curve of [1, 2, 3, 4, 5]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "scene-editor-curve-card";
          button.dataset.curve = String(curve);
          button.setAttribute("aria-label", `选择 Curve ${curve}`);
          button.innerHTML = `<span>Curve ${curve}</span>${waveIcon()}`;
          button.addEventListener("click", () => {
            pendingSceneCurve = curve;
            updateSceneEditor(editor);
          });
          curveGroup.appendChild(button);
        }
      }

      if (levelGroup && !levelGroup.querySelector("[data-level]")) {
        ["Off", "1", "2", "3", "4"].forEach((label, level) => {
          const segment = document.createElement("span");
          segment.className = "scene-editor-level-segment";
          segment.dataset.level = String(level);
          segment.textContent = label;
          segment.addEventListener("click", () => {
            pendingSceneMotionLevel = level;
            updateSceneEditor(editor);
          });
          levelGroup.appendChild(segment);
        });

        let isDraggingSceneLevel = false;
        const setSceneLevelFromPointer = (event) => {
          const rect = levelGroup.getBoundingClientRect();
          const segmentWidth = rect.width / 5;
          const level = clamp(Math.floor((event.clientX - rect.left) / segmentWidth), 0, 4);
          pendingSceneMotionLevel = level;
          updateSceneEditor(editor);
        };

        levelGroup.tabIndex = 0;
        levelGroup.addEventListener("pointerdown", (event) => {
          isDraggingSceneLevel = true;
          levelGroup.setPointerCapture?.(event.pointerId);
          setSceneLevelFromPointer(event);
        });
        levelGroup.addEventListener("pointermove", (event) => {
          if (isDraggingSceneLevel) setSceneLevelFromPointer(event);
        });
        levelGroup.addEventListener("pointerup", (event) => {
          isDraggingSceneLevel = false;
          levelGroup.releasePointerCapture?.(event.pointerId);
        });
        levelGroup.addEventListener("pointercancel", () => {
          isDraggingSceneLevel = false;
        });
        levelGroup.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
            event.preventDefault();
            pendingSceneMotionLevel = clamp(pendingSceneMotionLevel - 1, 0, 4);
            updateSceneEditor(editor);
          }
          if (event.key === "ArrowRight" || event.key === "ArrowUp") {
            event.preventDefault();
            pendingSceneMotionLevel = clamp(pendingSceneMotionLevel + 1, 0, 4);
            updateSceneEditor(editor);
          }
        });
      }

      if (trackGroup && !trackGroup.children.length) {
        for (const track of getSceneTrackOptions()) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "scene-editor-chip";
          button.dataset.track = track;
          button.textContent = track;
          button.addEventListener("click", () => {
            pendingSceneTrack = track;
            updateSceneEditor(editor);
          });
          trackGroup.appendChild(button);
        }
      }

      if (volumeGroup && !volumeGroup.dataset.bound) {
        volumeGroup.dataset.bound = "true";
        volumeGroup.tabIndex = 0;
        let isDraggingSceneVolume = false;
        const setSceneVolumeFromPointer = (event) => {
          const track = volumeGroup.querySelector(".scene-editor-volume-track");
          if (!track) return;
          const rect = track.getBoundingClientRect();
          const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
          pendingSceneVolume = clamp(Math.round(ratio * 100), 0, 100);
          updateSceneEditor(editor);
        };

        volumeGroup.addEventListener("pointerdown", (event) => {
          isDraggingSceneVolume = true;
          volumeGroup.setPointerCapture?.(event.pointerId);
          setSceneVolumeFromPointer(event);
        });
        volumeGroup.addEventListener("pointermove", (event) => {
          if (isDraggingSceneVolume) setSceneVolumeFromPointer(event);
        });
        volumeGroup.addEventListener("pointerup", (event) => {
          isDraggingSceneVolume = false;
          volumeGroup.releasePointerCapture?.(event.pointerId);
        });
        volumeGroup.addEventListener("pointercancel", () => {
          isDraggingSceneVolume = false;
        });
        volumeGroup.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
            event.preventDefault();
            pendingSceneVolume = clamp(pendingSceneVolume - 5, 0, 100);
            updateSceneEditor(editor);
          }
          if (event.key === "ArrowRight" || event.key === "ArrowUp") {
            event.preventDefault();
            pendingSceneVolume = clamp(pendingSceneVolume + 5, 0, 100);
            updateSceneEditor(editor);
          }
        });
      }

      if (backButton) backButton.addEventListener("click", () => toggleSceneEditor(false));
      if (saveButton) saveButton.addEventListener("click", saveCustomScene);
      if (deleteButton) deleteButton.addEventListener("click", () => toggleDeleteConfirm(true));
      if (deleteConfirmCancel) deleteConfirmCancel.addEventListener("click", () => toggleDeleteConfirm(false));
      if (deleteConfirm) {
        deleteConfirm.addEventListener("click", (event) => {
          if (event.target === deleteConfirm) toggleDeleteConfirm(false);
        });
      }
      if (deleteConfirmSubmit) deleteConfirmSubmit.addEventListener("click", deleteCustomScene);
      if (nameInput) {
        nameInput.addEventListener("input", () => {
          pendingSceneName = nameInput.value;
          updateSceneEditor(editor);
        });
      }
      if (monitoringSwitch) {
        monitoringSwitch.addEventListener("click", () => {
          pendingSceneMonitoring = !pendingSceneMonitoring;
          updateSceneEditor(editor);
        });
      }

      updateSceneEditor(editor);
      nameInput?.focus();
      persistPrototypeState();
    }

    function updateBabyEditorForm(root = activeLayer || document) {
      const nameInput = root.querySelector("#babySheetNameInput");
      const birthdayInput = root.querySelector("#babySheetBirthdayInput");
      const birthdayDisplay = root.querySelector("#babySheetBirthdayDisplay");
      const birthdayDisplayWrap = root.querySelector("#babySheetBirthdayDisplayWrap");
      const confirm = root.querySelector("#babySheetConfirmButton");
      const safeName = String(pendingBabyName || "").trim();
      if (nameInput && nameInput.value !== pendingBabyName) nameInput.value = pendingBabyName;
      if (birthdayInput && birthdayInput.value !== pendingBabyBirthday) birthdayInput.value = pendingBabyBirthday;
      if (birthdayDisplay) {
        birthdayDisplay.textContent = pendingBabyBirthday ? formatBirthday(pendingBabyBirthday) : "Child's Birthday";
      }
      if (birthdayDisplayWrap) {
        birthdayDisplayWrap.classList.toggle("is-filled", Boolean(pendingBabyBirthday));
      }
      if (confirm) confirm.disabled = !(safeName && pendingBabyBirthday);
    }

    function updateSceneEditor(root = activeLayer || document) {
      const title = root.querySelector("#sceneEditorTitle");
      if (title) {
        title.textContent = sceneEditorMode === "edit" ? "编辑哄睡方案" : "新增哄睡方案";
      }

      const nameInput = root.querySelector("#sceneEditorNameInput");
      if (nameInput && nameInput.value !== pendingSceneName) {
        nameInput.value = pendingSceneName;
      }

      const deleteButton = root.querySelector("#sceneEditorDeleteButton");
      if (deleteButton) {
        deleteButton.classList.toggle("is-hidden", sceneEditorMode !== "edit" || !editingSceneId);
      }

      for (const chip of root.querySelectorAll(".scene-editor-curve-card[data-curve]")) {
        chip.classList.toggle("is-selected", Number(chip.dataset.curve) === pendingSceneCurve);
        chip.setAttribute("aria-pressed", String(Number(chip.dataset.curve) === pendingSceneCurve));
      }
      for (const chip of root.querySelectorAll(".scene-editor-level-segment[data-level]")) {
        chip.classList.toggle("is-selected", Number(chip.dataset.level) === pendingSceneMotionLevel);
      }
      const levelControl = root.querySelector("#sceneEditorLevelGroup");
      if (levelControl) {
        levelControl.style.setProperty("--scene-editor-level-index", String(pendingSceneMotionLevel));
        levelControl.setAttribute("aria-valuenow", String(pendingSceneMotionLevel));
        levelControl.setAttribute("aria-valuetext", pendingSceneMotionLevel === 0 ? "Off" : `Level ${pendingSceneMotionLevel}`);
      }
      for (const chip of root.querySelectorAll(".scene-editor-chip[data-track]")) {
        chip.classList.toggle("is-selected", chip.dataset.track === pendingSceneTrack);
        chip.setAttribute("aria-pressed", String(chip.dataset.track === pendingSceneTrack));
      }
      for (const control of root.querySelectorAll(".scene-editor-volume-control")) {
        const safeVolume = clamp(Math.round(pendingSceneVolume), 0, 100);
        const ratio = safeVolume / 100;
        control.style.setProperty("--scene-editor-volume-fill", `${ratio * 100}%`);
        control.style.setProperty("--scene-editor-volume-thumb", `calc(${ratio * 100}% - 10px)`);
        control.setAttribute("aria-valuenow", String(safeVolume));
        control.setAttribute("aria-valuetext", `${safeVolume}%`);
        const valueLabel = control.querySelector(".scene-editor-volume-value");
        if (valueLabel) valueLabel.textContent = `${safeVolume}%`;
      }

      const monitoringSwitch = root.querySelector("#sceneEditorMonitoringSwitch");
      if (monitoringSwitch) {
        monitoringSwitch.classList.toggle("is-off", !pendingSceneMonitoring);
        monitoringSwitch.setAttribute("aria-pressed", String(pendingSceneMonitoring));
      }
    }

    function toggleAgeSheet(force) {
      const root = activeLayer || document;
      const ageSheet = root.querySelector(".age-sheet-options");
      if (!ageSheet) return;
      const nextVisible = typeof force === "boolean" ? force : ageSheet.style.display === "none";
      ageSheet.style.display = nextVisible ? "grid" : "none";
    }

    function addBabyProfile(name, birthday, months) {
      const trimmedName = String(name || "").trim();
      const safeBirthday = String(birthday || "").trim();
      const derivedMonths = typeof months === "number" && Number.isFinite(months)
        ? months
        : getNumericAgeFromBirthday(safeBirthday);
      const safeMonths = clamp(Math.round(derivedMonths ?? 3), 0, 24);
      if (!trimmedName || !safeBirthday) return false;
      const nextId = createBabyIdFromName(trimmedName);
      babies.push({
        id: nextId,
        name: trimmedName,
        birthday: safeBirthday,
        avatar: getBabyAvatar(trimmedName)
      });
      babyAgeById[nextId] = safeMonths;
      selectedBabyId = nextId;
      selectedBabyAgeMonths = safeMonths;
      pendingBabyName = "";
      pendingBabyBirthday = "";
      pendingBabyAge = 3;
      babyEditorVisible = false;
      rebuildOnboardingBabyChoices();
      persistPrototypeState();
      return true;
    }

    function goToOnboardingStep(step) {
      onboardingStep = clamp(Math.round(step), 1, 3);
      toggleAgeSheet(false);
      updateOnboardingDisplays();
    }

    function removeCustomScene(sceneId) {
      const scene = getSceneById(sceneId);
      if (!scene || !isCustomScene(scene)) return false;
      const index = scenes.findIndex((item) => item.id === scene.id);
      if (index >= 0) {
        scenes.splice(index, 1);
      }
      if (selectedSceneId === scene.id || !getVisibleScenes().some((item) => item.id === selectedSceneId)) {
        const generalScene = getSceneById("general");
        selectedSceneId = "general";
        syncRuntimeFromScene(generalScene);
        updateMotionControlDisplays();
        renderHud(screens[currentScreen]);
        updateSceneControls();
        updateSleepModeDynamic();
      } else {
        updateSceneControls();
        updateSleepModeDynamic();
      }
      return true;
    }

    function saveCustomScene() {
      let customScene = null;
      if (sceneEditorMode === "edit" && editingSceneId) {
        customScene = getSceneById(editingSceneId);
        if (!customScene || !isCustomScene(customScene)) return;
        applyPendingSceneToScene(customScene);
      } else {
        if (!canAddCustomScene()) {
          toast(`最多添加 ${MAX_CUSTOM_SCENES} 个自定义方案`);
          return;
        }
        customScene = createCustomSceneFromPending();
      }

      selectedSceneId = customScene.id;
      syncRuntimeFromScene(customScene);
      updateSceneControls();
      updateSceneEditor();
      updateSleepModeDynamic();
      updateMotionControlDisplays();
      renderHud(screens[currentScreen]);
      toggleSceneEditor(false);
      persistPrototypeState();
      toast(`已保存${customScene.title}`);
    }

    function deleteCustomScene() {
      const customScene = getSceneById(editingSceneId);
      if (!customScene || !isCustomScene(customScene)) {
        toggleSceneEditor(false);
        return;
      }
      removeCustomScene(customScene.id);
      toggleSceneEditor(false);
      persistPrototypeState();
      toast("移除成功");
    }

    function applySceneToGeneral(sceneId, { setActive = true } = {}) {
      const source = scenes.find((scene) => scene.id === sceneId);
      const general = scenes.find((scene) => scene.id === "general");
      if (!source || !general) return;
      general.mode = source.mode;
      general.curve = source.curve;
      general.movementPath = source.movementPath;
      general.motionLevel = source.motionLevel;
      general.realtimeMonitoring = source.realtimeMonitoring;
      general.track = source.track;
      general.volume = source.volume;
      general.loopMode = source.loopMode;
      general.meta = `${source.movementPath.replace("Curve ", "C")} · ${source.track.replace("Ocean Waves", "Ocean").replace("Moon Lullaby", "Lullaby").replace("Cotton Cloud", "Cloud")}`;
      if (setActive) {
        selectScene("general");
      } else {
        updateSceneControls();
        updateSleepModeDynamic();
      }
    }

    function applyRecommendedOnboarding() {
      const recommendation = getRecommendedProfile();
      applySceneToGeneral(recommendation.sceneId, { setActive: true });
      completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
      cribOnboardingCompleted = true;
      persistPrototypeState();
      showScreen(powerOn ? "soothing" : "soothingOff", "push");
    }

    function updateOnboardingDisplays(root = document) {
      const baby = getSelectedBaby();
      const recommendation = getRecommendedProfile();
      const scene = scenes.find((item) => item.id === recommendation.sceneId) || scenes[0];
      const stepMeta = {
        1: {
          progress: "步骤 1 / 3",
          title: `${DEVICE_NAME} 将照护的宝宝是？`,
          copy: "确认后，这张床的哄睡设置将以这位宝宝的信息为准。"
        },
        2: {
          progress: "步骤 2 / 3",
          title: `确认 ${baby.name} 的生日和月龄`,
          copy: "生日将用于估算月龄，帮助匹配适合当前阶段的哄睡方案。"
        },
        3: {
          progress: "步骤 3 / 3",
          title: `已为 ${baby.name} 生成哄睡推荐方案`,
          copy: "以下配置将保存至“初设”卡，后续可随时调整。"
        }
      };
      const currentStep = stepMeta[onboardingStep] || stepMeta[1];

      for (const value of root.querySelectorAll("#onboardingProgressLabel")) {
        value.textContent = currentStep.progress;
      }
      for (const value of root.querySelectorAll("#onboardingProgressFill")) {
        value.style.width = `${(onboardingStep / 3) * 100}%`;
      }
      for (const value of root.querySelectorAll("#onboardingTitle")) {
        value.textContent = currentStep.title;
      }
      for (const value of root.querySelectorAll("#onboardingCopy")) {
        value.textContent = currentStep.copy;
        value.classList.toggle("is-empty", !currentStep.copy);
      }
      for (const step of root.querySelectorAll(".onboarding-step")) {
        step.classList.toggle("is-active", Number(step.dataset.step) === onboardingStep);
      }
      for (const card of root.querySelectorAll(".onboarding-choice-card")) {
        const babyId = card.dataset.babyId;
        const isSelected = babyId === selectedBabyId;
        card.classList.toggle("is-selected", isSelected);
        card.setAttribute("aria-pressed", String(isSelected));
      }
      for (const value of root.querySelectorAll("[data-baby-age]")) {
        const babyId = value.getAttribute("data-baby-age");
        if (babyId) {
          const targetBaby = babies.find((item) => item.id === babyId);
          value.textContent = getAgeDisplayFromBirthday(targetBaby?.birthday);
        }
      }
      for (const value of root.querySelectorAll("#onboardingBabyAvatar")) {
        value.textContent = baby.avatar;
      }
      for (const value of root.querySelectorAll("#onboardingBabyName")) {
        value.textContent = baby.name;
      }
      for (const value of root.querySelectorAll("#onboardingBabyAgePill")) {
        value.textContent = getAgeDisplayFromBirthday(baby.birthday);
      }
      for (const value of root.querySelectorAll("#onboardingSummaryBirthday")) {
        value.textContent = formatBirthday(baby.birthday);
      }
      for (const value of root.querySelectorAll("#onboardingBirthdayInput")) {
        value.value = baby.birthday || "";
      }
      for (const value of root.querySelectorAll("#onboardingAgeValue")) {
        value.textContent = String(selectedBabyAgeMonths);
      }
      for (const value of root.querySelectorAll("#onboardingSceneCurve")) {
        value.textContent = scene.movementPath;
      }
      for (const value of root.querySelectorAll("#onboardingSceneLevel")) {
        value.textContent = String(scene.motionLevel);
      }
      for (const value of root.querySelectorAll("#onboardingSceneTrack")) {
        value.textContent = scene.track;
      }
      for (const value of root.querySelectorAll("#onboardingSceneVolume")) {
        value.textContent = `${scene.volume}%`;
      }
      for (const sheet of root.querySelectorAll(".age-sheet-options")) {
        if (!sheet.style.display) {
          sheet.style.display = "none";
        }
      }
      const editor = root.querySelector("#babyEditorScreen");
      if (editor && !editor.style.display) {
        editor.style.display = babyEditorVisible ? "flex" : "none";
      }
      for (const option of root.querySelectorAll(".age-sheet-option")) {
        option.classList.toggle("is-selected", Number(option.dataset.months) === selectedBabyAgeMonths);
      }
      updateBabyEditorForm(root);
    }

    function setupOnboardingFlow(layer) {
      const babyChoiceButtons = layer.querySelectorAll(".onboarding-choice-card");
      const returnButton = layer.querySelector("#onboardingReturnButton");
      const addBabyButton = layer.querySelector("#onboardingAddBabyButton");
      const step1NextButton = layer.querySelector("#onboardingStep1Next");
      const skipButton = layer.querySelector("#onboardingSkipButton");
      const ageSkipButton = layer.querySelector("#onboardingAgeSkipButton");
      const step3SkipButton = layer.querySelector("#onboardingStep3SkipButton");
      const ageButton = layer.querySelector("#onboardingAgeButton");
      const ageConfirmButton = layer.querySelector("#onboardingAgeConfirmButton");
      const backToBabyButton = layer.querySelector("#onboardingBackToBabyButton");
      const applyButton = layer.querySelector("#onboardingApplyButton");
      const ageSheet = layer.querySelector(".age-sheet-options");
      const ageGrid = layer.querySelector("#ageSheetGrid");
      const scrim = layer.querySelector(".onboarding-scrim");
      const onboardingBirthdayInput = layer.querySelector("#onboardingBirthdayInput");
      const babyEditorBackButton = layer.querySelector("#babyEditorBackButton");
      const babyNameInput = layer.querySelector("#babySheetNameInput");
      const babyBirthdayInput = layer.querySelector("#babySheetBirthdayInput");
      const babyAgeGrid = layer.querySelector("#babySheetAgeGrid");
      const babyConfirmButton = layer.querySelector("#babySheetConfirmButton");
      const babyCancelButton = layer.querySelector("#babySheetCancelButton");

      for (const button of babyChoiceButtons) {
        button.addEventListener("click", () => selectBabyProfile(button.dataset.babyId || babies[0].id));
      }
      if (returnButton) {
        returnButton.addEventListener("click", () => {
          if (babyEditorVisible) {
            toggleBabyEditor(false);
            return;
          }
          if (onboardingStep > 1) {
            goToOnboardingStep(onboardingStep - 1);
            return;
          }
          openWorkspacePanel("devices");
        });
      }
      if (addBabyButton) addBabyButton.addEventListener("click", () => {
        if (ageSheet) ageSheet.style.display = "none";
        pendingBabyName = "";
        pendingBabyBirthday = "";
        pendingBabyAge = 3;
        toggleBabyEditor(true);
      });
      if (step1NextButton) step1NextButton.addEventListener("click", () => goToOnboardingStep(2));
      if (skipButton) skipButton.addEventListener("click", () => {
        completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
        cribOnboardingCompleted = true;
        persistPrototypeState();
        openWorkspacePanel("detail");
      });
      if (ageSkipButton) ageSkipButton.addEventListener("click", () => {
        completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
        cribOnboardingCompleted = true;
        persistPrototypeState();
        openWorkspacePanel("detail");
      });
      if (step3SkipButton) step3SkipButton.addEventListener("click", () => {
        completedOnboardingVersion = ONBOARDING_FLOW_VERSION;
        cribOnboardingCompleted = true;
        persistPrototypeState();
        openWorkspacePanel("detail");
      });
      if (ageButton) ageButton.addEventListener("click", () => toggleAgeSheet());
      if (ageConfirmButton) ageConfirmButton.addEventListener("click", () => goToOnboardingStep(3));
      if (applyButton) applyButton.addEventListener("click", applyRecommendedOnboarding);
      if (scrim) scrim.addEventListener("click", () => toggleAgeSheet(false));
      if (onboardingBirthdayInput) {
        onboardingBirthdayInput.addEventListener("input", () => {
          updateSelectedBabyBirthday(onboardingBirthdayInput.value);
        });
      }
      if (babyEditorBackButton) babyEditorBackButton.addEventListener("click", () => toggleBabyEditor(false));
      if (babyCancelButton) babyCancelButton.addEventListener("click", () => toggleBabyEditor(false));

      if (ageGrid) {
        for (const months of [1, 2, 3, 4, 5, 6, 9, 12]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "age-sheet-option";
          button.dataset.months = String(months);
          button.textContent = String(months);
          button.addEventListener("click", () => setBabyAge(months));
          ageGrid.appendChild(button);
        }
      }

      if (babyAgeGrid) {
        for (const months of [1, 2, 3, 4, 5, 6, 9, 12]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "age-sheet-option";
          button.dataset.months = String(months);
          button.textContent = String(months);
          button.addEventListener("click", () => {
            pendingBabyAge = months;
            updateBabyEditorForm(layer);
          });
          babyAgeGrid.appendChild(button);
        }
      }

      if (babyNameInput) {
        babyNameInput.addEventListener("input", () => {
          pendingBabyName = babyNameInput.value;
          updateBabyEditorForm(layer);
        });
      }

      if (babyBirthdayInput) {
        babyBirthdayInput.addEventListener("input", () => {
          pendingBabyBirthday = babyBirthdayInput.value;
          const derivedAge = getNumericAgeFromBirthday(pendingBabyBirthday);
          if (derivedAge !== null) {
            pendingBabyAge = clamp(derivedAge, 0, 24);
          }
          updateBabyEditorForm(layer);
        });
      }

      if (babyConfirmButton) {
        babyConfirmButton.addEventListener("click", () => {
          if (!addBabyProfile(pendingBabyName, pendingBabyBirthday, pendingBabyAge)) return;
          toggleBabyEditor(false);
          toast(`已添加 ${getSelectedBaby().name}`);
        });
      }

      if (ageSheet && !ageSheet.style.display) {
        ageSheet.style.display = "none";
      }

      updateOnboardingDisplays(layer);
    }

    function persistPrototypeState() {
      try {
        localStorage.setItem("cribPrototypeState", JSON.stringify({
          powerOn,
          selectedDurationMinutes,
          remainingSeconds,
          selectedCurve,
          motionLevel,
          realtimeMonitoring,
          activeTrack,
          noiseVolume,
          loopMode,
          selectedSceneId,
          nightLightOn,
          nightLightBrightness,
          nightLightTemperature,
          cribOnboardingCompleted,
          completedOnboardingVersion,
          selectedBabyId,
          selectedBabyAgeMonths,
          powerHintShown,
          babies,
          babyAgeById,
          pendingBabyBirthday,
          babyEditorVisible,
          scenes
        }));
      } catch {}
    }

    function loadPrototypeState() {
      try {
        const saved = JSON.parse(localStorage.getItem("cribPrototypeState") || "null");
        if (!saved || typeof saved !== "object") return;
        if (typeof saved.powerOn === "boolean") powerOn = saved.powerOn;
        if (typeof saved.selectedDurationMinutes === "number") selectedDurationMinutes = saved.selectedDurationMinutes;
        if (typeof saved.remainingSeconds === "number") remainingSeconds = saved.remainingSeconds;
        if (typeof saved.selectedCurve === "number") selectedCurve = saved.selectedCurve;
        if (typeof saved.motionLevel === "number") motionLevel = saved.motionLevel;
        if (typeof saved.realtimeMonitoring === "boolean") realtimeMonitoring = saved.realtimeMonitoring;
        if (typeof saved.activeTrack === "string") activeTrack = saved.activeTrack;
        if (typeof saved.noiseVolume === "number") noiseVolume = saved.noiseVolume;
        if (typeof saved.loopMode === "string") loopMode = saved.loopMode;
        if (typeof saved.selectedSceneId === "string") selectedSceneId = saved.selectedSceneId;
        if (typeof saved.nightLightOn === "boolean") nightLightOn = saved.nightLightOn;
        if (typeof saved.nightLightBrightness === "number") nightLightBrightness = saved.nightLightBrightness;
        if (typeof saved.nightLightTemperature === "number") nightLightTemperature = saved.nightLightTemperature;
        if (typeof saved.powerHintShown === "boolean") powerHintShown = saved.powerHintShown;
        if (Array.isArray(saved.babies)) {
          babies.length = 0;
          for (const persistedBaby of saved.babies) {
            if (!persistedBaby || typeof persistedBaby !== "object") continue;
            if (typeof persistedBaby.id !== "string" || typeof persistedBaby.name !== "string") continue;
            babies.push({
              id: persistedBaby.id,
              name: persistedBaby.name,
              birthday: typeof persistedBaby.birthday === "string"
                ? persistedBaby.birthday
                : "",
              avatar: typeof persistedBaby.avatar === "string" ? persistedBaby.avatar : getBabyAvatar(persistedBaby.name)
            });
          }
        }
        if (saved.babyAgeById && typeof saved.babyAgeById === "object") {
          for (const baby of babies) {
            if (typeof saved.babyAgeById[baby.id] === "number") {
              babyAgeById[baby.id] = saved.babyAgeById[baby.id];
            }
          }
        }
        if (typeof saved.completedOnboardingVersion === "number") completedOnboardingVersion = saved.completedOnboardingVersion;
        if (typeof saved.selectedBabyId === "string" && babies.some((baby) => baby.id === saved.selectedBabyId)) {
          selectedBabyId = saved.selectedBabyId;
        }
        if (!saved.babyAgeById && typeof saved.selectedBabyAgeMonths === "number") {
          babyAgeById[selectedBabyId] = saved.selectedBabyAgeMonths;
        }
        if (typeof saved.pendingBabyBirthday === "string") pendingBabyBirthday = saved.pendingBabyBirthday;
        if (typeof saved.babyEditorVisible === "boolean") babyEditorVisible = saved.babyEditorVisible;
        selectedBabyAgeMonths = getBabyAgeForId(selectedBabyId);
        if (typeof saved.cribOnboardingCompleted === "boolean") {
          cribOnboardingCompleted = saved.cribOnboardingCompleted && completedOnboardingVersion >= ONBOARDING_FLOW_VERSION;
        }
        if (Array.isArray(saved.scenes)) {
          for (const persisted of saved.scenes) {
            if (!persisted || typeof persisted !== "object" || typeof persisted.id !== "string") continue;
            const localScene = scenes.find((scene) => scene.id === persisted.id);
            if (!localScene) {
              if (String(persisted.id).startsWith("custom")) {
                scenes.push({ ...persisted, loopMode: "single", showInStrip: persisted.showInStrip !== false });
              }
              continue;
            }
            Object.assign(localScene, persisted);
          }
        }
        for (const scene of scenes) {
          scene.loopMode = "single";
          if (scene.id === "general") scene.title = "Preset";
          if (scene.id === "night" || scene.id === "nap") {
            scene.showInStrip = false;
          }
        }
        if (!getVisibleScenes().some((scene) => scene.id === selectedSceneId)) {
          selectedSceneId = "general";
        }
        loopMode = "single";
      } catch {}
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function roundToStep(value, step) {
      return Math.round(value / step) * step;
    }

    function setMotionLevel(level) {
      motionLevel = clamp(level, 0, 4);
      getActiveScene().motionLevel = motionLevel;
      updateMotionControlDisplays();
      updateSleepModeDynamic();
      persistPrototypeState();
    }

    function getActiveScene() {
      return scenes.find((scene) => scene.id === selectedSceneId) || scenes[0];
    }

    function selectScene(sceneId) {
      const scene = scenes.find((item) => item.id === sceneId);
      if (!scene) return;
      selectedSceneId = scene.id;
      selectedCurve = scene.curve;
      motionLevel = scene.motionLevel;
      realtimeMonitoring = scene.realtimeMonitoring;
      activeTrack = scene.track;
      noiseVolume = scene.volume;
      loopMode = scene.loopMode;
      noisePlaying = true;
      updateSceneControls();
      updateSleepModeDynamic();
      updateMotionControlDisplays();
      renderHud(screens[currentScreen]);
      persistPrototypeState();
    }

    function setNightLightBrightness(value) {
      nightLightBrightness = clamp(Math.round(value), 0, 100);
      updateNightLightControls();
      persistPrototypeState();
    }

    function setNightLightTemperature(value) {
      nightLightTemperature = clamp(roundToStep(value, 100), 2700, 5500);
      updateNightLightControls();
      persistPrototypeState();
    }

    function setNightLightPower(nextPower) {
      if (nightLightOn === nextPower) return;
      nightLightOn = nextPower;
      updateNightLightControls();
      persistPrototypeState();
    }

    function updateMotionControlDisplays(root = document) {
      for (const button of root.querySelectorAll(".motion-curve-button")) {
        const isSelected = Number(button.dataset.curve) === selectedCurve;
        button.classList.toggle("is-selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      }

      for (const control of root.querySelectorAll(".motion-level-control")) {
        control.style.setProperty("--motion-level-left", `${motionLevel * 74}px`);
        control.setAttribute("aria-valuenow", String(motionLevel));
        control.setAttribute("aria-valuetext", motionLevel === 0 ? "Off" : `Level ${motionLevel}`);
        for (const segment of control.querySelectorAll(".motion-level-segment")) {
          segment.classList.toggle("is-selected", Number(segment.dataset.level) === motionLevel);
        }
      }
    }

    function updateSceneControls(root = document) {
      for (const button of root.querySelectorAll(".scene-card")) {
        const scene = scenes.find((item) => item.id === button.dataset.sceneId);
        const isSelected = button.dataset.sceneId === selectedSceneId;
        button.classList.toggle("is-selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
        if (scene) {
          const title = button.querySelector(".scene-card-title");
          if (title) {
            title.textContent = scene.title;
          }
        }
      }
    }

    function updateSleepModeDynamic(root = document) {
      const scene = getActiveScene();
      const isEditableCustomScene = isCustomScene(scene) && scene.showInStrip !== false;
      for (const dynamic of root.querySelectorAll(".sleep-mode-dynamic")) {
        dynamic.classList.toggle("is-on", powerOn);
        dynamic.classList.toggle("is-off", !powerOn);
      }

      for (const title of root.querySelectorAll(".sleep-mode-surface-title")) {
        title.textContent = isEditableCustomScene ? scene.title : "Sleep-Soothing Mode";
      }

      for (const button of root.querySelectorAll(".sleep-mode-edit-button")) {
        button.classList.toggle("is-hidden", !isEditableCustomScene);
        const label = `编辑${scene.title || "自定义方案"}方案`;
        button.setAttribute("aria-label", label);
        button.title = label;
      }

      for (const button of root.querySelectorAll(".sleep-mode-power-button")) {
        const label = powerOn ? "关闭哄睡模式" : "开启哄睡模式";
        button.setAttribute("aria-label", label);
        button.title = label;
        button.setAttribute("aria-pressed", String(powerOn));
      }

      for (const value of root.querySelectorAll(".sleep-mode-tile-card.is-motion .sleep-mode-tile-value")) {
        value.textContent = scene.movementPath;
      }

      for (const value of root.querySelectorAll(".sleep-mode-tile-card.is-noise .sleep-mode-tile-value")) {
        value.textContent = activeTrack;
      }
    }

    function updatePowerHint(root = document) {
      const shouldShow = cribOnboardingCompleted && !powerOn && !powerHintShown && (currentScreen === "soothing" || currentScreen === "soothingOff");
      const hints = root.matches?.(".power-hint")
        ? [root, ...root.querySelectorAll(".power-hint")]
        : [...root.querySelectorAll(".power-hint")];
      for (const hint of hints) {
        hint.classList.toggle("is-visible", shouldShow);
      }
      window.clearTimeout(powerHintTimer);
      if (shouldShow) {
        powerHintShown = true;
        persistPrototypeState();
        powerHintTimer = window.setTimeout(() => {
          for (const hint of document.querySelectorAll(".power-hint")) {
            hint.classList.remove("is-visible");
          }
        }, 1600);
      }
    }

    function updateNightLightControls(root = document) {
      const controlRoots = root.matches?.(".night-light-controls")
        ? [root, ...root.querySelectorAll(".night-light-controls")]
        : [...root.querySelectorAll(".night-light-controls")];

      for (const controls of controlRoots) {
        controls.classList.toggle("is-off", !nightLightOn);
      }

      for (const value of root.querySelectorAll(".night-light-title-value")) {
        value.textContent = `${nightLightBrightness}%`;
      }

      for (const button of root.querySelectorAll(".night-light-switch")) {
        button.classList.toggle("is-off", !nightLightOn);
        button.setAttribute("aria-pressed", String(nightLightOn));
      }

      for (const slider of root.querySelectorAll(".night-light-slider-control")) {
        const isTemperature = slider.dataset.type === "temperature";
        const min = Number(slider.dataset.min);
        const max = Number(slider.dataset.max);
        const value = isTemperature ? nightLightTemperature : nightLightBrightness;
        const displayValue = isTemperature ? `${value}K` : `${value}%`;
        const ratio = clamp((value - min) / (max - min), 0, 1);
        const trackWidth = 338;
        const fillWidth = ratio * trackWidth;
        slider.style.setProperty("--night-light-fill-width", `${fillWidth}px`);
        slider.style.setProperty("--night-light-thumb-left", `${fillWidth - 14}px`);
        slider.setAttribute("aria-valuenow", String(value));
        slider.setAttribute("aria-valuetext", displayValue);
        const valueLabel = slider.querySelector(".night-light-slider-value");
        if (valueLabel) {
          valueLabel.textContent = displayValue;
        }
      }
    }

    function renderRequirementPanel(panel = activeWorkspacePanel) {
      const content = requirementContent[panel] || requirementContent.devices;
      requirementTitleEl.textContent = content.title;
      requirementCopyEl.textContent = content.copy;

      if (!content.sections.length) {
        requirementBodyEl.innerHTML = "";
        return;
      }

      requirementBodyEl.innerHTML = content.sections.map((section) => {
        const items = Array.isArray(section.items) && section.items.length
          ? `<ul class="requirement-list">${section.items.map((item) => `<li>${item}</li>`).join("")}</ul>`
          : "";
        const copy = section.copy ? `<div class="requirement-section-copy">${section.copy}</div>` : "";
        return `<section class="requirement-section"><div class="requirement-section-title">${section.title}</div>${copy}${items}</section>`;
      }).join("");
    }

    function updateWorkspaceNav(panel = activeWorkspacePanel) {
      for (const button of workspaceNav.querySelectorAll(".workspace-nav-button")) {
        const isActive = button.dataset.panelTarget === panel;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      }
    }

    function openWorkspacePanel(panel) {
      activeWorkspacePanel = panel;
      updateWorkspaceNav(panel);
      renderRequirementPanel(panel);

      if (panel === "devices") {
        showScreen("devices", "fade");
        return;
      }

      if (panel === "onboarding") {
        if (!babies.some((baby) => baby.id === selectedBabyId)) {
          selectedBabyId = babies[0].id;
        }
        selectedBabyAgeMonths = getBabyAgeForId(selectedBabyId);
        onboardingStep = 1;
        showScreen("onboarding", "push");
        return;
      }

      if (panel === "detail") {
        showScreen(powerOn ? "soothing" : "soothingOff", "push");
      }
    }

    function renderHud(screen) {
      const mode = powerOn ? "On" : "Off";
      hud.innerHTML = `<strong>${screen.label}</strong><span>Power ${mode}</span><span>Noise ${noisePlaying ? "Playing" : "Paused"}</span>`;
    }

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("is-visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("is-visible");
      }, 1200);
      renderHud(screens[currentScreen]);
    }

    function formatCountdown(seconds) {
      const safeSeconds = Math.max(0, seconds);
      const minutes = Math.floor(safeSeconds / 60);
      const remainder = safeSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
    }

    function getCountdownDisplaySeconds() {
      return powerOn ? remainingSeconds : selectedDurationMinutes * 60;
    }

    function updateTimerDisplays() {
      for (const button of document.querySelectorAll(".timer-control")) {
        button.classList.toggle("is-on", powerOn);
        button.classList.toggle("is-off", !powerOn);
      }
      for (const value of document.querySelectorAll(".timer-value")) {
        value.textContent = formatCountdown(getCountdownDisplaySeconds());
      }
      updateTimerOptionButtons();
    }

    function updateTimerOptionButtons(root = document) {
      for (const button of root.querySelectorAll(".timer-option")) {
        button.classList.toggle("is-selected", Number(button.dataset.minutes) === pendingDurationMinutes);
      }
    }

    function stopCountdown() {
      window.clearInterval(countdownInterval);
      countdownInterval = null;
    }

    function startCountdown() {
      stopCountdown();
      if (!powerOn) return;
      countdownInterval = window.setInterval(() => {
        if (!powerOn) {
          stopCountdown();
          return;
        }
        if (remainingSeconds > 0) {
          remainingSeconds -= 1;
          updateTimerDisplays();
        } else {
          stopCountdown();
        }
      }, 1000);
    }

    function resetCountdown(minutes) {
      remainingSeconds = minutes * 60;
      updateTimerDisplays();
      startCountdown();
      persistPrototypeState();
    }

    loadPrototypeState();
    for (const button of workspaceNav.querySelectorAll(".workspace-nav-button")) {
      button.addEventListener("click", () => {
        openWorkspacePanel(button.dataset.panelTarget || "devices");
      });
    }
    updateWorkspaceNav(activeWorkspacePanel);
    renderRequirementPanel(activeWorkspacePanel);
    showScreen(currentScreen, "none");
    updateTimerDisplays();
  </script>
</body>
</html>
