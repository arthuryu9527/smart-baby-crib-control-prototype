<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figma Baby Crib Interactive Prototype</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef0f6;
      color: #1b1523;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 24px;
    }

    .stage {
      display: grid;
      grid-template-columns: 260px minmax(520px, 1fr) 360px;
      gap: 24px;
      width: min(100%, 1440px);
      height: calc(100vh - 48px);
      align-items: stretch;
      overflow: hidden;
    }

    .workspace-sidebar,
    .requirement-panel,
    .demo-panel {
      min-height: 0;
      border: 1px solid rgba(96, 74, 134, 0.08);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 48px rgba(31, 28, 46, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .workspace-sidebar,
    .requirement-panel {
      padding: 24px;
    }

    .sidebar-kicker,
    .requirement-kicker,
    .demo-kicker {
      color: #7a68a8;
      font: 600 12px/16px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .sidebar-title,
    .requirement-title,
    .demo-title {
      margin: 10px 0 0;
      color: #201929;
      font: 650 24px/30px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .sidebar-copy,
    .requirement-copy,
    .demo-copy {
      margin: 10px 0 0;
      color: #6c6479;
      font: 400 14px/21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .workspace-nav {
      margin-top: 24px;
      display: grid;
      gap: 12px;
    }

    .workspace-nav-button {
      width: 100%;
      min-height: 92px;
      display: grid;
      gap: 6px;
      justify-items: start;
      padding: 18px;
      border: 1px solid #ebe4fb;
      border-radius: 18px;
      background: #fff;
      color: #21192b;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 120ms ease;
    }

    .workspace-nav-button:active {
      transform: scale(0.985);
    }

    .workspace-nav-button.is-active {
      border-color: #d4c4ff;
      background: #f7f2ff;
      box-shadow: 0 10px 24px rgba(128, 94, 214, 0.12);
    }

    .workspace-nav-button:focus-visible {
      outline: 3px solid rgba(58, 120, 214, 0.36);
      outline-offset: 2px;
    }

    .workspace-nav-title {
      font: 650 18px/24px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .workspace-nav-meta {
      color: #7e758a;
      font: 400 13px/19px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .demo-panel {
      padding: 24px 24px 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      align-items: start;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .demo-panel-head {
      width: 100%;
      display: grid;
      gap: 8px;
    }

    .demo-panel-frame {
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: start center;
      padding: 16px 0 0;
      overflow: visible;
    }

    .phone-frame {
      width: fit-content;
      max-width: none;
      display: grid;
      justify-items: center;
      gap: 14px;
      transform: scale(0.8);
      transform-origin: top center;
    }

    .requirement-panel {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      overflow: hidden;
    }

    .requirement-body {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 14px;
      overflow-x: hidden;
      overflow-y: auto;
      padding-right: 6px;
      -webkit-overflow-scrolling: touch;
    }

    .requirement-section {
      padding: 16px 16px 14px;
      border: 1px solid #ece6fb;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.84);
    }

    .requirement-section-title {
      color: #2a2136;
      font: 650 16px/22px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .requirement-section-copy {
      margin-top: 8px;
      color: #6f667c;
      font: 400 14px/21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .requirement-list {
      margin: 10px 0 0;
      padding-left: 18px;
      color: #3a3145;
      font: 400 14px/21px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    .requirement-list li + li {
      margin-top: 6px;
    }

    .requirement-empty {
      min-height: 100%;
      border: 1px dashed rgba(180, 169, 202, 0.72);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.44);
    }

    .phone {
      position: relative;
      flex: 0 0 auto;
      width: var(--screen-w);
      min-width: var(--screen-w);
      max-width: var(--screen-w);
      height: var(--screen-h);
      min-height: var(--screen-h);
      max-height: var(--screen-h);
      overflow: hidden;
      background: #fff;
      border-radius: 30px;
      box-shadow:
        0 22px 64px rgba(31, 28, 46, 0.16),
        0 8px 24px rgba(31, 28, 46, 0.1);
      transition: width 320ms cubic-bezier(0.22, 1, 0.36, 1), height 320ms cubic-bezier(0.22, 1, 0.36, 1);
      contain: layout paint;
    }

    .screen-stack,
    .screen-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .screen-layer {
      z-index: 1;
      transform: translate3d(0, 0, 0);
      opacity: 1;
      filter: none;
      will-change: transform, opacity, filter;
      transition:
        transform var(--motion-duration, 360ms) cubic-bezier(0.22, 1, 0.36, 1),
        opacity var(--motion-duration, 360ms) ease,
        filter var(--motion-duration, 360ms) ease;
    }

    .screen-image-fixed-top {
      clip-path: inset(0 0 calc(100% - var(--fixed-top-height, 408px)) 0);
    }

    .screen-scroll-region {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--scroll-region-top, 408px);
      bottom: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-y;
    }

    .screen-scroll-region::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    .screen-scroll-canvas {
      position: relative;
      width: 100%;
    }

    .screen-scroll-content {
      position: relative;
      width: 100%;
      top: calc(-1 * var(--scroll-offset, 0px));
    }

    .screen-scroll-region .hotspot,
    .screen-scroll-region .scene-card,
    .screen-scroll-region .scene-add-button,
    .screen-scroll-region .timer-control,
    .screen-scroll-region .night-light-switch,
    .screen-scroll-region .night-light-slider-control {
      touch-action: pan-y;
    }

    .screen-layer.no-motion {
      transition: none;
    }

    .screen-layer.from-right {
      transform: translate3d(100%, 0, 0);
      opacity: 0.98;
    }

    .screen-layer.from-left {
      transform: translate3d(-32%, 0, 0);
      opacity: 0.72;
      filter: brightness(0.96);
    }

    .screen-layer.from-right-soft {
      transform: translate3d(42%, 0, 0);
      opacity: 0.84;
    }

    .screen-layer.from-left-soft {
      transform: translate3d(-42%, 0, 0);
      opacity: 0.84;
    }

    .screen-layer.from-bottom {
      transform: translate3d(0, 100%, 0);
      opacity: 0.98;
      filter: drop-shadow(0 -18px 40px rgba(30, 20, 48, 0.16));
    }

    .screen-layer.fade-in {
      transform: scale(0.985);
      opacity: 0;
    }

    .screen-layer.to-left {
      transform: translate3d(-32%, 0, 0);
      opacity: 0.72;
      filter: brightness(0.96);
    }

    .screen-layer.to-right {
      transform: translate3d(100%, 0, 0);
      opacity: 0.92;
    }

    .screen-layer.to-left-soft {
      transform: translate3d(-42%, 0, 0);
      opacity: 0.78;
    }

    .screen-layer.to-right-soft {
      transform: translate3d(42%, 0, 0);
      opacity: 0.78;
    }

    .screen-layer.to-bottom {
      transform: translate3d(0, 100%, 0);
      opacity: 0.98;
      filter: drop-shadow(0 -18px 40px rgba(30, 20, 48, 0.14));
    }

    .screen-layer.fade-out {
      transform: scale(1.012);
      opacity: 0;
    }

    .screen-layer.dim-back {
      filter: brightness(0.88);
    }

    .screen-layer.content-fade-in,
    .screen-layer.content-fade-out {
      opacity: 0;
    }

    .screen-layer.clip-content {
      clip-path: inset(var(--clip-top, 408px) 0 0 0);
    }

    .screen-layer.clip-stable-top {
      clip-path: inset(0 0 calc(100% - var(--clip-top, 408px)) 0);
    }

    .screen-image {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspots {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .hotspot {
      position: absolute;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      touch-action: manipulation;
      border-radius: 16px;
    }

    .phone.is-transitioning .hotspot {
      pointer-events: none;
    }

    .phone.is-transitioning .motion-curve-grid,
    .phone.is-transitioning .motion-level-control,
    .phone.is-transitioning .scene-card,
    .phone.is-transitioning .night-light-switch,
    .phone.is-transitioning .night-light-slider-control,
    .phone.is-transitioning .monitoring-action-button {
      pointer-events: none;
    }

    .hotspot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(95, 49, 168, 0.08);
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .hotspot:active::after {
      opacity: 1;
      transform: scale(1);
    }

    .hotspot.is-power-toggle::after,
    .hotspot.is-power-toggle:active::after {
      opacity: 0;
      transform: none;
    }

    .hotspot.is-power-toggle:focus-visible {
      outline: none;
      background: transparent;
    }

    .hotspot:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
      background: rgba(95, 49, 168, 0.08);
    }

    .timer-control {
      position: absolute;
      z-index: 7;
      left: 32px;
      top: 487px;
      width: 100px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 11px;
      border: 0;
      border-radius: 999px;
      background: var(--timer-bg);
      color: var(--timer-color);
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 1px var(--timer-border);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    .timer-control.is-on {
      --timer-bg: #efeaff;
      --timer-border: #d8ccff;
      --timer-color: #562b96;
    }

    .timer-control.is-off {
      --timer-bg: #f5f4f6;
      --timer-border: #e6e1e8;
      --timer-color: #8a8290;
    }

    .timer-control::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(95, 49, 168, 0.1);
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .timer-control:active::after {
      opacity: 1;
      transform: scale(1);
    }

    .timer-control:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .power-hint {
      position: absolute;
      left: 315px;
      top: 462px;
      z-index: 4;
      width: 56px;
      height: 56px;
      pointer-events: none;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 220ms ease;
      transform-origin: 50% 50%;
    }

    .power-hint.is-visible {
      opacity: 1;
      animation: powerHintCirclePulse 1.5s ease-out 1;
    }

    .power-hint::before,
    .power-hint::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .power-hint::before {
      background: radial-gradient(circle, rgba(163, 122, 255, 0.18) 0%, rgba(163, 122, 255, 0.08) 48%, rgba(163, 122, 255, 0) 74%);
    }

    .power-hint::after {
      border: 2px solid rgba(141, 111, 247, 0.32);
      box-shadow: 0 0 0 0 rgba(141, 111, 247, 0.12);
    }

    @keyframes powerHintCirclePulse {
      0% {
        transform: scale(0.92);
        opacity: 0;
      }
      18% {
        opacity: 0.88;
      }
      58% {
        transform: scale(1.18);
        opacity: 0.56;
      }
      100% {
        transform: scale(1.28);
        opacity: 0;
      }
    }

    .timer-clock {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      box-sizing: border-box;
    }

    .timer-clock::before,
    .timer-clock::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1.5px;
      border-radius: 999px;
      background: currentColor;
      transform-origin: center bottom;
    }

    .timer-clock::before {
      height: 5px;
      transform: translate(-50%, -100%);
    }

    .timer-clock::after {
      height: 7px;
      transform: translate(-50%, -100%) rotate(58deg);
    }

    .timer-value {
      position: relative;
      z-index: 1;
      min-width: 45px;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }

    .timer-options {
      position: absolute;
      left: 16px;
      top: 648px;
      z-index: 4;
      width: 370px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 11px;
      isolation: isolate;
    }

    .timer-options::before {
      content: "";
      position: absolute;
      inset: -10px -8px;
      z-index: 0;
      border-radius: 28px;
      background: #fff;
    }

    .timer-option {
      position: relative;
      z-index: 1;
      height: 48px;
      border: 0;
      border-radius: 24px;
      background: #f4f4f5;
      color: #251227;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 1px rgba(30, 20, 48, 0.03), 0 1px 2px rgba(30, 20, 48, 0.04);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .timer-option:active {
      transform: scale(0.97);
    }

    .timer-option.is-selected {
      background: #5d2fa2;
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 6px 16px rgba(93, 47, 162, 0.18);
    }

    .timer-option:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .noise-loop-mask {
      position: absolute;
      left: 292px;
      top: 182px;
      z-index: 5;
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #fff;
      pointer-events: none;
    }

    .motion-controls {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .motion-curve-grid {
      position: absolute;
      left: 16px;
      top: 414px;
      width: 370px;
      display: grid;
      grid-template-columns: repeat(3, 120px);
      gap: 16px 5px;
      pointer-events: auto;
    }

    .motion-curve-button {
      width: 120px;
      height: 94px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 15px 16px 14px;
      border: 1px solid #ecebed;
      border-radius: 16px;
      background: #fff;
      color: #28121f;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .motion-curve-button:active {
      transform: scale(0.97);
    }

    .motion-curve-button.is-selected {
      border-color: #e3d8ff;
      background: #f4efff;
      color: #5d2fa2;
    }

    .motion-curve-button:focus-visible,
    .motion-level-control:focus-visible {
      outline: 3px solid rgba(95, 49, 168, 0.48);
      outline-offset: 2px;
    }

    .motion-curve-wave {
      width: 47px;
      height: 32px;
      color: inherit;
    }

    .motion-level-control {
      position: absolute;
      left: 16px;
      top: 702px;
      width: 370px;
      height: 38px;
      display: grid;
      grid-template-columns: repeat(5, 74px);
      padding: 0;
      border: 0;
      border-radius: 48px;
      background: #f5f1fb;
      color: #28121f;
      pointer-events: auto;
      cursor: pointer;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .motion-level-thumb {
      position: absolute;
      left: var(--motion-level-left, 222px);
      top: 0;
      width: 74px;
      height: 38px;
      border-radius: 48px;
      background: #5d2fa2;
      box-shadow: 0 6px 14px rgba(93, 47, 162, 0.18);
      transition: left 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .motion-level-segment {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border: 0;
      padding: 0;
      border-radius: 48px;
      background: transparent;
      color: inherit;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      cursor: pointer;
      transition: color 160ms ease;
    }

    .motion-level-segment.is-selected {
      color: #fff;
    }

    .sleep-mode-dynamic {
      position: absolute;
      inset: 0;
      z-index: 6;
      color: #5d2fa2;
      pointer-events: none;
    }

    .sleep-mode-surface {
      position: absolute;
      left: 16px;
      top: 424px;
      z-index: 3;
      width: 370px;
      height: 218px;
      isolation: isolate;
      border: 1px solid #f1ebff;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.68) 0%, rgba(250, 247, 255, 0.28) 48%, rgba(236, 226, 255, 0.4) 100%),
        linear-gradient(135deg, #fdfbff 0%, #f8f4ff 48%, #f1ebff 100%);
      box-shadow: 0 8px 24px rgba(93, 47, 162, 0.06);
      pointer-events: auto;
      overflow: hidden;
      transition: background 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
    }

    .sleep-mode-surface::before {
      content: "";
      position: absolute;
      inset: -32px -120px;
      z-index: 0;
      background:
        radial-gradient(50% 68% at 32% 42%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0) 62%),
        linear-gradient(115deg, rgba(255, 255, 255, 0) 18%, rgba(166, 137, 248, 0.18) 42%, rgba(255, 255, 255, 0.72) 50%, rgba(166, 137, 248, 0.13) 58%, rgba(255, 255, 255, 0) 82%);
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-32%, 0, 0);
    }

    .sleep-mode-surface .sleep-mode-tile-card {
      top: 104px;
    }

    .sleep-mode-dynamic.is-on .sleep-mode-surface {
      border-color: rgba(169, 142, 213, 0.34);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.58) 0%, rgba(248, 244, 255, 0.2) 48%, rgba(234, 224, 255, 0.38) 100%),
        linear-gradient(135deg, #fdfbff 0%, #f8f2ff 48%, #f0e8ff 100%);
      box-shadow: 0 10px 28px rgba(93, 47, 162, 0.08);
    }

    .sleep-mode-dynamic.is-on .sleep-mode-surface::before {
      opacity: 1;
      animation: sleepModeSurfaceFlow 4.2s ease-in-out infinite alternate;
    }

    @keyframes sleepModeSurfaceFlow {
      0% {
        transform: translate3d(-36%, 0, 0);
      }
      100% {
        transform: translate3d(34%, 0, 0);
      }
    }

    .sleep-mode-title-row {
      position: absolute;
      left: 14px;
      top: 12px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 250px;
      pointer-events: auto;
    }

    .sleep-mode-surface-title {
      max-width: 196px;
      overflow: hidden;
      color: #251227;
      font: 510 16px/20px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sleep-mode-edit-button {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;

      top: 2px;
      left: var(--night-light-knob-left, 20px);

      height: 28px;
      border-radius: 50%;

      padding: 0;
      background: transparent;

      pointer-events: auto;

      transition: opacity 180ms ease, transform 180ms ease;

      top: 0;
      color: #4c4350;
      font: 500 11px/14px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;

    .night-light-slider-label {
      left: 0;
    }

    .night-light-slider-value {
      right: 0;
      color: #8d8491;
      font-weight: 400;
    }

    .night-light-slider-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 22px;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: #f0eef3;
    }

    .night-light-slider-fill {

      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #b2a5fb 0%, #9c8df0 100%);

      background: linear-gradient(90deg, #ffb55f 0%, #f4eadf 48%, #abcfff 100%);
    }

    .night-light-slider-thumb {
      position: absolute;
      left: var(--night-light-thumb-left, 140px);
      top: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(30, 20, 48, 0.18);

    .night-light-slider-hint {

      top: 34px;
      color: #140a2e;
      font: 500 11px/14px -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

      left: 0;
    }

    .night-light-slider-hint.is-max {
      right: 0;
    }

    .night-light-collapsed-mask {

      top: 800px;
      z-index: 1;
      width: 402px;
      height: 74px;
      background: #fff;

    }

    .night-light-collapsed-card {
      position: absolute;
      left: 16px;
      top: 724px;
      z-index: 2;

      height: 72px;

      align-items: center;

      letter-spacing: 0;
      opacity: 0;

      left: auto;
      top: 18px;
      right: 16px;
      flex: 0 0 auto;
    }

      align-items: center;
      gap: 9px;

    }

    .night-light-controls:not(.is-off) .night-light-collapsed-card .night-light-switch {
      pointer-events: none;
    }

    .monitoring-controls {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .monitoring-action-button {
      position: absolute;
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .monitoring-action-button:focus-visible {
      outline: 3px solid rgba(45, 129, 248, 0.58);
      outline-offset: 2px;
    }

    .monitoring-action-button::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(45, 129, 248, 0.1);
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .monitoring-action-button:active::after {
      opacity: 1;
      transform: scale(1);
    }

    .monitoring-action-button.is-recording::before {
      content: "";
      position: absolute;
      right: 8px;
      top: 8px;
      z-index: 1;
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #ee2f3f;
      box-shadow: 0 2px 8px rgba(238, 47, 63, 0.42);
    }

    .monitoring-recording-badge {
      position: absolute;
      right: 16px;
      top: 142px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(22, 15, 31, 0.54);
      color: #fff;

      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .monitoring-recording-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ee2f3f;
      box-shadow: 0 0 0 4px rgba(238, 47, 63, 0.18);
    }

    .monitoring-recording-badge.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .monitoring-snapshot-preview {
      position: absolute;
      left: 0;
      top: 126px;
      z-index: 5;
      width: 402px;
      height: 218px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 0;
      background-image: url("assets/monitoring.png");
      background-size: 402px auto;
      background-position: 0 -126px;
      box-shadow: 0 14px 28px rgba(23, 16, 35, 0.16);
      opacity: 0.98;
      transform-origin: right top;
      transition:
        left 520ms cubic-bezier(0.22, 1, 0.36, 1),
        top 520ms cubic-bezier(0.22, 1, 0.36, 1),
        width 520ms cubic-bezier(0.22, 1, 0.36, 1),
        height 520ms cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 520ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 260ms ease,
        transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .monitoring-snapshot-preview.is-minimized {
      left: 276px;
      top: 142px;
      width: 108px;
      height: 66px;
      border-radius: 12px;
      background-size: 402px auto;
      opacity: 1;
    }

    .monitoring-snapshot-preview.is-dismissed {
      opacity: 0;
      transform: translate3d(12px, -8px, 0) scale(0.82);
    }

    .hud {
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid rgba(86, 62, 116, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 34px rgba(31, 28, 46, 0.09);
      color: rgba(27, 21, 35, 0.68);
      font-size: 13px;
      line-height: 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .hud strong {
      color: #563098;
      font-weight: 650;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 5;
      max-width: calc(100% - 32px);
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(32, 21, 48, 0.88);
      color: #fff;
      font-size: 13px;
      line-height: 18px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
      white-space: nowrap;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 460px) {
      body {
        padding: 0;
        background: #fff;
      }

      .stage {
        grid-template-columns: 1fr;
        width: 100%;
        gap: 0;
        min-height: auto;
      }

      .workspace-sidebar,
      .requirement-panel {
        display: none;
      }

      .demo-panel {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .demo-panel-head {
        display: none;
      }

      .demo-panel-frame {
        padding: 0;
      }

      .phone-frame {
        width: 100%;
        gap: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .phone-frame::before,
      .phone-frame::after {
        display: none;
      }

      .phone {
        width: min(var(--screen-w), 100vw);
        height: calc(min(var(--screen-w), 100vw) * var(--screen-ratio));
        box-shadow: none;
        border-radius: 0;
      }

      .hud {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .phone,
      .screen-layer,
      .hotspot::after,
      .motion-curve-button,
      .motion-level-thumb,
      .night-light-title,
      .night-light-switch,
      .night-light-switch::after,
      .night-light-parameter-mask,
      .night-light-slider-control,
      .night-light-collapsed-mask,
      .night-light-collapsed-card,
      .power-hint,
      .power-hint::before,
      .power-hint::after,
      .monitoring-action-button::after,
      .monitoring-recording-badge,
      .monitoring-snapshot-preview,
      .toast {
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

    function resetLayerState(layer) {
      layer.classList.remove(...transientLayerClasses);
      layer.style.zIndex = "";

      layer.style.removeProperty("--clip-top");

    function createScreenImage(screen, options = {}) {
      const image = document.createElement("img");
      image.className = "screen-image";
      image.src = screen.image;
      image.alt = options.alt ?? screen.alt;
      if (options.fixedTopHeight) {
        image.classList.add("screen-image-fixed-top");
        image.style.setProperty("--fixed-top-height", `${options.fixedTopHeight}px`);
      }
      if (options.ariaHidden) {
        image.alt = "";
        image.setAttribute("aria-hidden", "true");
      }
      return image;
    }

    function appendHotspots(screen, parent, filterFn = () => true, heightRef = screen.height) {
      const hotspotLayer = document.createElement("div");
      hotspotLayer.className = "hotspots";
      let count = 0;

      for (const spot of screen.hotspots) {
        if (!filterFn(spot)) continue;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "hotspot";
        if (spot.label === "切换总开关" || spot.label === "打开总开关") {
          button.classList.add("is-power-toggle");
        }
        button.setAttribute("aria-label", spot.label);
        button.title = spot.label;
        button.style.left = `${(spot.x / screen.width) * 100}%`;
        button.style.top = `${(spot.y / heightRef) * 100}%`;
        button.style.width = `${(spot.w / screen.width) * 100}%`;
        button.style.height = `${(spot.h / heightRef) * 100}%`;
        button.addEventListener("click", spot.action);
        hotspotLayer.appendChild(button);
        count += 1;
      }

      if (count > 0) {
        parent.appendChild(hotspotLayer);
      }
    }

    function initializeScrollableRegion(layer, screen) {
      if (!screen.scrollable || !Number.isFinite(screen.stableTop)) return;
      const scrollRegion = layer.querySelector(".screen-scroll-region");
      if (!scrollRegion) return;
      scrollRegion.scrollTop = 0;
    }

    function showScreen(name, transitionName = "fade") {
      const screen = screens[name];
      if (!screen || transitionLocked) return;
      if (name === currentScreen && activeLayer) {
        renderHud(screen);
        return;
      }

      const transition = activeLayer ? transitions[transitionName] || transitions.fade : transitions.none;
      const previousScreen = screens[currentScreen];
      if (activeLayer && transition.contentOnly && previousScreen?.stableTop && screen.stableTop) {
        showContentTabScreen(name, screen, previousScreen, transition);
        return;
      }

      const previousLayer = activeLayer;
      const nextLayer = createLayer(screen);
      const hasMotion = transition.duration > 0;

      currentScreen = name;
      phone.style.setProperty("--screen-w", `${screen.width}px`);
      phone.style.setProperty("--screen-h", `${screen.height}px`);
      phone.style.setProperty("--screen-ratio", screen.height / screen.width);
      renderHud(screen);

      nextLayer.style.setProperty("--motion-duration", `${transition.duration}ms`);
      if (previousLayer) {
        previousLayer.style.setProperty("--motion-duration", `${transition.duration}ms`);
      }

      if (transition.nextFrom) {
        nextLayer.classList.add(transition.nextFrom);
      }

      if (!previousLayer || !hasMotion) {
        screenStack.replaceChildren(nextLayer);
        nextLayer.classList.remove("no-motion");
        activeLayer = nextLayer;
        initializeScrollableRegion(nextLayer, screen);
        updateTimerDisplays();
        updatePowerHint(activeLayer);
        return;
      }

      transitionLocked = true;
      phone.classList.add("is-transitioning");

      if (transition.placeNextBelow) {
        nextLayer.style.zIndex = "1";
        previousLayer.style.zIndex = "2";
        screenStack.insertBefore(nextLayer, previousLayer);
      } else {
        previousLayer.style.zIndex = "1";
        nextLayer.style.zIndex = "2";
        screenStack.appendChild(nextLayer);
      }

      nextLayer.getBoundingClientRect();
      requestAnimationFrame(() => {
        nextLayer.classList.remove(transition.nextFrom);
        if (transition.prevTo) {
          previousLayer.classList.add(transition.prevTo);
        }
      });

      window.setTimeout(() => {
        screenStack.replaceChildren(nextLayer);
        resetLayerState(nextLayer);
        activeLayer = nextLayer;
        transitionLocked = false;
        phone.classList.remove("is-transitioning");
        initializeScrollableRegion(nextLayer, screen);
        updateTimerDisplays();
        updatePowerHint(activeLayer);
      }, transition.duration + 40);
    }

    function showContentTabScreen(name, screen, previousScreen, transition) {
      const previousLayer = activeLayer;
      const nextLayer = createLayer(screen);
      const stableTopLayer = createLayer(previousScreen, { hotspots: false, overlays: false, scrollable: false });
      const clipTop = screen.stableTop || previousScreen.stableTop;

      currentScreen = name;
      phone.style.setProperty("--screen-w", `${screen.width}px`);
      phone.style.setProperty("--screen-h", `${screen.height}px`);
      phone.style.setProperty("--screen-ratio", screen.height / screen.width);
      renderHud(screen);

      transitionLocked = true;
      phone.classList.add("is-transitioning");

      for (const layer of [previousLayer, nextLayer, stableTopLayer]) {
        layer.style.setProperty("--motion-duration", `${transition.duration}ms`);
        layer.style.setProperty("--clip-top", `${clipTop}px`);
      }

      previousLayer.classList.add("clip-content");
      previousLayer.style.zIndex = "1";
      nextLayer.classList.add("clip-content", transition.nextFrom);
      nextLayer.style.zIndex = "2";
      stableTopLayer.classList.add("clip-stable-top");
      stableTopLayer.style.zIndex = "3";

      screenStack.appendChild(nextLayer);
      screenStack.appendChild(stableTopLayer);

      nextLayer.getBoundingClientRect();
      requestAnimationFrame(() => {
        nextLayer.classList.remove(transition.nextFrom);
        previousLayer.classList.add(transition.prevTo);
      });

      window.setTimeout(() => {
        resetLayerState(nextLayer);
        screenStack.replaceChildren(nextLayer);
        activeLayer = nextLayer;
        transitionLocked = false;
        phone.classList.remove("is-transitioning");
        initializeScrollableRegion(nextLayer, screen);
        updateTimerDisplays();
        updatePowerHint(activeLayer);
      }, transition.duration + 40);
    }

    function createLayer(screen, options = {}) {
      const withHotspots = options.hotspots !== false;
      const withOverlays = options.overlays !== false;
      const withScrollable = options.scrollable !== false && !!screen.scrollable && Number.isFinite(screen.stableTop);
      const layer = document.createElement("div");
      layer.className = "screen-layer";

      if (withScrollable) {
        if (screen.image) {
          layer.appendChild(createScreenImage(screen, { fixedTopHeight: screen.stableTop }));
        }

        if (withHotspots) {
          appendHotspots(screen, layer, (spot) => spot.y < screen.stableTop);
        }

        const scrollRegion = document.createElement("div");
        scrollRegion.className = "screen-scroll-region";
        scrollRegion.style.setProperty("--scroll-region-top", `${screen.stableTop}px`);

        const scrollCanvas = document.createElement("div");
        scrollCanvas.className = "screen-scroll-canvas";
        scrollCanvas.style.height = `${Math.max((screen.scrollHeight || screen.height) - screen.stableTop, screen.height - screen.stableTop)}px`;

        const scrollContent = document.createElement("div");
        scrollContent.className = "screen-scroll-content";
        scrollContent.style.setProperty("--scroll-offset", `${screen.stableTop}px`);
        scrollContent.style.height = `${Math.max(screen.scrollHeight || screen.height, screen.height)}px`;

        if (screen.image) {
          scrollContent.appendChild(createScreenImage(screen, { ariaHidden: true }));
        }

        if (withOverlays) {
          renderOverlays(screen, scrollContent);
        }

        if (withHotspots) {
          appendHotspots(screen, scrollContent, (spot) => spot.y >= screen.stableTop, screen.scrollHeight || screen.height);
        }

        scrollCanvas.appendChild(scrollContent);
        scrollRegion.appendChild(scrollCanvas);
        layer.appendChild(scrollRegion);
        return layer;
      }

      if (screen.image) {
        layer.appendChild(createScreenImage(screen));
      }

      if (withOverlays) {
        renderOverlays(screen, layer);
      }

      if (withHotspots) {
        appendHotspots(screen, layer);
      }
      return layer;
    }

    function createNightLightSlider(config) {
      const slider = document.createElement("div");
      slider.className = `night-light-slider-control${config.type === "temperature" ? " is-temperature" : ""}`;
      slider.tabIndex = 0;
      slider.dataset.type = config.type;
      slider.dataset.min = String(config.min);
      slider.dataset.max = String(config.max);
      slider.dataset.step = String(config.step);
      slider.style.setProperty("--night-light-slider-top", `${config.top}px`);
      slider.setAttribute("role", "slider");
      slider.setAttribute("aria-label", config.label);
      slider.setAttribute("aria-valuemin", String(config.min));
      slider.setAttribute("aria-valuemax", String(config.max));
      slider.innerHTML = `
        <span class="night-light-slider-label">${config.label}</span>
        <span class="night-light-slider-value"></span>
        <div class="night-light-slider-track"><div class="night-light-slider-fill"></div></div>
        <div class="night-light-slider-thumb"></div>
        <span class="night-light-slider-hint is-min">${config.minLabel}</span>
        <span class="night-light-slider-hint is-max">${config.maxLabel}</span>`;

      let isDragging = false;
      const setFromPointer = (event) => {
        const rect = slider.getBoundingClientRect();
        const ratio = clamp((event.clientX - rect.left) / rect.width, 0, 1);
        const rawValue = config.min + ratio * (config.max - config.min);
        config.setValue(roundToStep(rawValue, config.step));
      };

      slider.addEventListener("pointerdown", (event) => {
        if (!nightLightOn) return;
        isDragging = true;
        slider.setPointerCapture?.(event.pointerId);
        setFromPointer(event);
      });
      slider.addEventListener("pointermove", (event) => {
        if (isDragging) setFromPointer(event);
      });
      slider.addEventListener("pointerup", (event) => {
        isDragging = false;
        slider.releasePointerCapture?.(event.pointerId);
      });
      slider.addEventListener("pointercancel", () => {
        isDragging = false;
      });
      slider.addEventListener("keydown", (event) => {
        if (!nightLightOn) return;
        const currentValue = config.getValue();
        if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
          event.preventDefault();
          config.setValue(currentValue - config.step);
        }
        if (event.key === "ArrowRight" || event.key === "ArrowUp") {
          event.preventDefault();
          config.setValue(currentValue + config.step);
        }
      });

      return slider;
    }

    function formatBirthday(value) {
      if (!value) return "未填写";
      const match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return value;
      return `${match[1]}.${match[2]}.${match[3]}`;
    }

    function parseDateOnly(value) {
      const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return null;
      return new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])));
    }

    function getDaysBetween(start, end) {
      const msPerDay = 24 * 60 * 60 * 1000;
      return Math.max(0, Math.floor((end - start) / msPerDay));
    }

    function getWholeMonthsAndRemainder(startDate, endDate) {
      let months = (endDate.getUTCFullYear() - startDate.getUTCFullYear()) * 12 + (endDate.getUTCMonth() - startDate.getUTCMonth());
      let anchor = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth() + months, startDate.getUTCDate()));
      if (anchor > endDate) {
        months -= 1;
        anchor = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth() + months, startDate.getUTCDate()));
      }
      return { months: Math.max(0, months), days: getDaysBetween(anchor, endDate) };
    }

    function getAgeDisplayFromBirthday(birthday) {
      const birthDate = parseDateOnly(birthday);
      if (!birthDate) return "未填写";
      const totalDays = getDaysBetween(birthDate, AGE_REFERENCE_DATE);
      if (totalDays <= 28) return "Newborn";
      const { months, days } = getWholeMonthsAndRemainder(birthDate, AGE_REFERENCE_DATE);
      if (months <= 0) return "1 Month";
      if (days === 0) return `${months} Months`;
      if (days < 15) return `${months} - ${months + 0.5} Months`;
      return `${months + 0.5} - ${months + 1} Months`;
    }

    function getNumericAgeFromBirthday(birthday) {
      const birthDate = parseDateOnly(birthday);
      if (!birthDate) return null;
      const totalDays = getDaysBetween(birthDate, AGE_REFERENCE_DATE);
      if (totalDays <= 28) return 0;
      const { months, days } = getWholeMonthsAndRemainder(birthDate, AGE_REFERENCE_DATE);
      if (months <= 0) return 1;
      return months + (days >= 15 ? 1 : 0);
    }
